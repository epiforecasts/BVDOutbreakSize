ws 082, no gap: Ituri 297 (recus, 70 positifs: 34 vivants + 27 decedes + 9 reprelevements; positivity implied on the received count, no separate 'testes' word, included as 297) + Nord-Kivu 134 (recus et testes, 11 positifs) + Haut-Uele 7 (`7 echantillons testes positifs`, a stated completed-test count per the same reading applied to 082's Haut-Uele figure - see above) + Tshopo 1 (`1 echantillon teste positif pour la journee`, same reading) + Sud-Kivu 5 (recus, tous negatifs) = 444; confirmed increment 80 <= 444, denominator valid. This revises an earlier draft of this entry, which had excluded Haut-Uele and Tshopo (giving 436) by treating 'testes positifs' the same as the plain 'positifs' wording used elsewhere (e.g. 081's Haut-Uele, which has no 'testes' verb and stays excluded) - corrected before merge for consistency with the 082 precedent immediately above. FORMAT CHANGE from SitRep 084 (6 August, MVEBDB brief format): section renumbered 3.2 -> 1.4, and for the first time gives the NATIONAL 24h-analysed total directly in prose rather than requiring a per-province sum (the per-province breakdown is now incomplete: several provinces give only a confirmed-case count, not a total-analysed count) - a genuine source-format shift, not a methodology change to the stream itself. SitRep 084: section 1.4 Laboratoire: '360 echantillons ont ete analyses, confirmant 67 nouveaux cas de MVE' (confirmed increment 67 <= 360), national total used directly. SitRep 085 (7 August): section 1.4 Laboratoire: '326 echantillons ont ete analyses, confirmant 89 nouveaux cas de MVE (positivite: 27,3%)' (confirmed increment 89 <= 326; a second, inconsistent Ituri-only positivity figure of 26,1% appears in the 1.4.2 Defis paragraph, not used), national total used directly. Each of 083-085 read independently by two blind agents who agreed on every value (zero disagreements). See GitHub issue #562 for the full SitRep-084 format-change writeup. SitRep 086 (8 August): section 1.4 Laboratoire: '400 echantillons ont ete analyses, confirmant 85 nouveaux cas de MVE (positivite: 21,3%)' (confirmed increment 85 <= 400), national total used directly. SitRep 087 (9 August): '405 echantillons ont ete analyses, confirmant 87 nouveaux cas de MVE (positivite: 21,5%)' (87 <= 405), matches the per-ZS table total exactly, no discrepancy. SitRep 088 (10 August): '376 echantillons ont ete analyses, confirmant 78 nouveaux cas de MVE (positivite: 20,7%)' - the '78' figure is INCONSISTENT with the per-ZS table's own 24h total (68 = 53 Ituri + 15 Nord-Kivu) and the FAITS SAILLANTS headline (68); the lab paragraph's own preceding sentence separately states Ituri's 63 positifs decompose as 53 nouveaux cas + 10 reprelevements, so 78 (=63+15) appears to conflate reprelevements with new confirmations. The samples-analysed figure itself (376) is not in dispute and is used directly; the confirmed-count discrepancy is noted here and in data/insp_sitrep_scanned.csv but does not change 376, and 68 <= 376 (the auditable figure) keeps the denominator valid regardless of which case count is used. SitRep 089 (11 August): 'Au total, (516 echantillons ont ete analyses, confirmant 118 nouveaux cas de MVE (positivite: 22,9%)' (stray unclosed parenthesis printed in the source, transcribed as seen) - this time 118 matches the per-ZS/headline total exactly (98 Ituri + 18 Nord-Kivu + 2 Haut-Uele = 118), Ituri's 21 reprelevements correctly excluded; confirmed increment 118 <= 516. Each of 086-089 read independently by two blind agents who agreed on every value (zero disagreements), including both independently catching the 088 laboratoire inconsistency."

# Cumulative national confirmed-case totals (lab `Cumul positifs`, equal
# to the front-page `Cumul cas confirmés`). Sourced from the INRB-UMIE
# `national_cumulative_confirmed_cases` daily series (their transcription
# of the same INSP situation reports), regenerated by
# scripts/confirm_insp_data.jl and spot-confirmed against the directly
# scanned headline for each overlapping vintage
# (data/insp_sitrep_scanned.csv). The series runs from the first national
# point (14 May) to the latest report. The daily likelihood fits the
# between-vintage increments, not the nested totals (heavy backfill; the
# report date is the publication date, not symptom onset). SitRep 029
# (12 June) was not published, so the series steps 11 -> 13 June. The
# 29 May-14 June points have no published national analysed denominator,
# so they are fitted as unanchored windows via the laboratory-throughput
# queue (Poisson-thinned). The cut-off scalar `confirmed_cases` is derived
# from the final vintage at load time.
