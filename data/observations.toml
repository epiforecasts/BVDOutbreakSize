# block once national reporting switched to the confirmed-only format on
# 29 May. These are the analysed *denominators* the unanchored windows
# lack: the model pairs each with the same day's confirmed-case increment
# and scores
# it as `Binomial(analysed_24h, positivity)`, anchoring the laboratory
# positivity (hence the non-BVD background λ_bg) where the cumulative
# `tests_analysed_history` stops at 28 May. The 24h positives are NOT
# added as a separate numerator: they are the same events as the confirmed
# increments already fitted, so using them again would double-count (#235).
# Inclusion rule: a day is populated when the SitRep reports a coherent 24h
# analysed total and that day's national confirmed-case increment does not
# exceed it (confirmed ≤ analysed). That inequality is the condition for a
# valid Binomial denominator and the only documented failure mode: you
# cannot confirm more specimens than you analysed, so a confirmed increment
# above the analysed total would be internally inconsistent. Province-level
# reporting is summed across the provinces that publish an analysed count;
# Nord-Kivu "pending for reagents" is received-but-not-yet-analysed (outside
