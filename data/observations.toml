# Patients currently in isolation/hospitalisation: a daily count of how many
# patients are in a bed. This is the headline "Patients en isolement -
# hospitalisation" figure on page 1 of the confirmed-based SitReps (SitReps
# 018-028, 030-039, 1-22 June), the count of patients (confirmed plus suspected)
# physically in an isolation/treatment bed at the end of the reporting day,
# cross-checked against the Tableau IV "Patients en isolement (Fin J)"
# provincial totals. A patient enters the bed when reported as a suspect and
# leaves on discharge (recovery, death or rule-out), so the count is the
# admission inflow convolved with a length-of-stay survival. The model fits
# it with the length-of-stay observation submodel
# (`treatment_admission_model`): a proportion of the reported suspects are
# admitted, the BVD ones staying for a sampled treatment length-of-stay and
# the non-BVD ones leaving once their negative result returns (after the
# report-to-receipt laboratory delay), so the bed count is a BVD/background
# mixture and its day-by-day level and lag identify the admission proportion
# and the treatment stay. It is scored as a per-day count against the
# modelled count on each report day (never differenced), with its own
# dispersion. SitReps 016-017 (30-31 May) print a DIFFERENT column, "Cas
# suspects en isolement" (suspects only, 101 then 104), relabelled to the
# all-patients "Patients en isolement" from SitRep 018; the two are not the
# same quantity, so the fitted series begins 1 June (SitRep 018) where the
# all-patients definition is stable.
