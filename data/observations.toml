source = "INSP situation reports 7-30 June 2026 (SitReps 024-028, 030-042, 044, 046, 047), read from the PDFs; recorded in the new_daily_suspected_deaths column of data/insp_sitrep_scanned.csv. National per-day count of suspected deaths in the preceding 24h, printed alongside the daily new-suspect count as 'cas suspects du jour N (M deces)': 35 on 7 June, 41 on 8 June, 30 on 9 June, 50 on 10 June, 64 on 11 June, 49 on 13 June, 54 on 14 June, 61 on 15 June, 46 on 16 June, 35 on 17 June, 54 on 18 June, 47 on 19 June, 30 on 20 June, 60 on 21 June, 44 on 22 June, 45 on 23 June, 40 on 24 June and 77 on 25 June (cross-checks the INRB-UMIE national_cumulative_suspected_deaths DRC values, the daily-new series for June dates: 20 June 30, 21 June 60, 22 June 44, 23 June 45, 24 June 40, 25 June 77). SitReps 021-023 (4-6 June) print the new-suspect count without a deaths-of-the-day figure, so the series begins 7 June; SitRep 029 (12 June) was not published upstream, so 12 June is absent. SitRep 043 (26 June) was also not published, so the series steps 25 June -> 27 June; 70 on 27 June (SitRep 044 prints cas suspects du jour 239 (70 deces); cross-checks the INRB-UMIE national_cumulative_suspected_deaths DRC daily-new value 70). SitRep 045 (28 June) was also not published, so the series steps 27 June -> 29 June; 90 on 29 June (SitRep 046 page-1 tile cas suspects du jour 309 (90 deces); Tableau 3 alertes validees Decedees Ituri 58 + Nord-Kivu 32 = 90; the section-4.2 narrative sentence says 87 deces, but the tile, Tableau 3 and the INRB-UMIE national_cumulative_suspected_deaths DRC daily-new value all agree on 90, so 90 is used). SitRep 047 (30 June) directly follows 046 (29 June, no gap); 77 on 30 June. The page-1 tile and section-4.2 narrative print 'cas suspects du jour 301 (90 deces)', but the report's own Tableau 3 Decedees (alertes validees) row sums to Ituri 43 + Nord-Kivu 34 + Sud-Kivu 0 = 77, contradicting the headline 90; the 90 also repeats the 29 June value exactly and coincides with the Nord-Kivu cas-suspects-du-jour cell (90) in the same Tableau 3, so it reads as a data-entry / carry-forward error rather than a genuine 24h count. Following the 23 May (SitRep 009) precedent of taking the auditable Tableau zone-row sum when the front-page headline is a data-entry error (there 220 over the erroneous 119), the Tableau 3 zone-sum 77 is used and the headline 90 is recorded as the discrepancy. The INRB-UMIE national_cumulative_suspected_deaths DRC daily-new value 90 transcribes the same page-1 tile, so it is not an independent cross-check. The suspect-CASE count 301 is unaffected: it is internally consistent (Tableau 3 Ituri 211 + Nord-Kivu 90 = 301, matching the tile and narrative) and changed from 29 June's 309, so it stands as a genuine fresh daily value. SitRep 048 (1 July) directly follows 047 (30 June), no gap; prints cas suspects du jour 150 (41 deces), a fresh distinct value (down from the disputed 90/77 on 30 June); the 41 suspect-deaths headline agrees with the INRB-UMIE national_cumulative_suspected_deaths DRC daily-new value 41, so 41 is used with no discrepancy this vintage. SitRep 049 (2 July) directly follows 048 (1 July), no gap; prints cas suspects du jour 213 (63 deces); the 63 suspect-deaths headline agrees with the report's own Tableau 3 alertes validees Decedees row (Ituri 45 + Nord-Kivu 18 + Sud-Kivu 0 = 63) and with the INRB-UMIE national_cumulative_suspected_deaths DRC daily-new value 63, so 63 is used with no discrepancy this vintage."

