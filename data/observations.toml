# Genetic TMRCA. A soft lower bound on the seeding time T, the time to
# the most recent common ancestor of the first sequenced cases. It is a
# lower bound because adding sequences, or more geographically
# representative ones, only pushes the TMRCA older. `date` is the BEAST X
# v10.6.0 mean TMRCA under the Skygrid non-parametric coalescent prior
# (mbalaplacide2026), the more flexible of the two tree-prior models
# reported. `days_sd` is the SD on the location of the floor (uncertainty
# in the estimate, in either direction), derived from the reported 95%
# HPD interval (09 Feb to 12 Apr: 62 days / 3.92 ~ 16 days).
# `alt_date` / `alt_days_sd` carry the same estimate under the Exponential
# growth tree prior (mean 2026-03-08, 95% HPD 2026-02-01 to 2026-04-05,
# SD ~ 16 days), used by the tree-prior sensitivity analysis.
# Both dates are converted to days before `as_of_date` at load time, so they
# track changes to the cut-off.
[genetic_tmrca]
date        = "2026-03-15"
days_sd     = 16
alt_date    = "2026-03-08"
alt_days_sd = 16
source = "BEAST X v10.6.0 analysis of 139 BDBV genomes (mbalaplacide2026, 2026-07-10 virological.org post; GTR substitution model, strict molecular clock, Skygrid and Exponential growth coalescent priors). Skygrid baseline: mean TMRCA 2026-03-15, 95% HPD 2026-02-09 to 2026-04-12. Exponential growth sensitivity: mean TMRCA 2026-03-08, 95% HPD 2026-02-01 to 2026-04-05. Both at the outbreak-specific ~1.1E-3 substitutions/site/year rate. Estimates sample 139 genomes across 16 health zones and are a lower bound on the outbreak age, since further sequencing only pushes the TMRCA older. Using the genetic TMRCA as a seeding bound follows a suggestion of N. Ferguson (ferguson2026)."
