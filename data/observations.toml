# Daily new suspected cases ("nouveaux cas suspects du jour", later
# "cas suspects du jour"): the per-day count of newly reported suspects in
# the preceding 24h, published in the confirmed-based SitReps from 4 June
# (SitReps 021-027, 4-10 June). This is the
# post-26 May continuation of the suspected-case signal. The national
# CUMULATIVE suspected total was frozen at 26 May (see `reported_case_history`)
# once INSP began reclassifying suspects downward (the cumulative fell, which
# a count likelihood cannot represent), but the daily new-suspect inflow is a
# genuine per-day incidence that never falls, so it can be fitted directly.
# The model scores each count against the modelled daily suspected series
# (the p_drc-scaled BVD onset-to-report signal plus the non-BVD background)
# on its report day, sharing the suspect pipeline and surveillance dispersion
# with the frozen cumulative stream, the same daily-anchor route the post-
# cutoff lab volume uses (`tests_analysed_daily_history`). The days (4-11
# June) fall strictly after the cumulative series ends (26 May), so the two
# suspected likelihoods cover disjoint days and do not double-count. Earlier
# confirmed-based reports (SitReps 015-020, 29 May-3 June) do not print a
# national new-suspect-of-the-day figure, so the series begins on 4 June.
[suspected_daily_history]
dates  = ["2026-06-04", "2026-06-05", "2026-06-06", "2026-06-07",
          "2026-06-08", "2026-06-09", "2026-06-10", "2026-06-11"]
