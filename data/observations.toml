# Manual, opt-in occupancy reclassification-break days. Each listed date is a
# day on which the treatment-flow submodel fits a single level step into the
# modelled occupancy mean (`treatment_flow_model` / `cumulative_occupancy_
# offset`), letting the modelled occupancy track a between-report measurement-
# basis discontinuity in the observed `isolation_history` series without
# bending Rt to chase it. Use it only for a known, persistent basis change
# (e.g. the day the occupancy series switches from Tableau 6 provincial sums to
# the page-1 headline, or a documented DHIS2 reclassification), not day-to-day
# reporting noise, which the NegativeBinomial occupancy dispersion already
# absorbs. Each step is sampled, centred on zero with a weakly informative
# prior (`occupancy_break_sd`, default 25 beds), so the fit partitions it into
# reporting artifact vs real demand. Filtered to the cut-off like the
# histories; empty → no-op.
[occupancy_break_dates]
value  = ["2026-06-09", "2026-06-19", "2026-07-14"]
source = "Occupancy reclassification-break days: documented, non-confounded between-report basis changes in isolation_history where the reported start-of-day in-bed stock (Patients au lit (J-1)) falls below the previous report's end-of-day occupancy (Patients en isolement Fin J) by more than the day's admissions and discharges can bridge, a reclassification the smooth inflow-through-survival demand cannot reproduce. Both fall on consecutive published SitReps (no intervening unpublished vintage), so each is a clean one-day step rather than a two-day increment confounded with growth. 2026-06-09: the Fin J occupancy steps 8 June 297 -> 9 June 260 (-37) during a growing outbreak, and the 9 June start-of-day au-lit (J-1) 268 (SitRep 026 isolement table Ituri 245 + Nord-Kivu 17 + Sud-Kivu 6 = 268) is -29 below the 8 June Fin J 297 (SitRep 025), against near-exact reconciliation on the neighbouring days (7 June au-lit 283 vs 6 June Fin J 283 = 0; 8 June 310 vs 7 June 309 = +1; 10 June 262 vs 9 June 260 = +2). The drop is concentrated in the suspected pool: dont suspects 184 (SitRep 025, 8 June) -> 143 (SitRep 026, 9 June) = -41 while dont confirmes 113 -> 117 = +4, a de-registration of ruled-out suspects, not a fall in confirmed cases. It coincides with the first Taux d'occupation print (65.0% on 9 June) and a SitRep 026 mission conjointe surveillance / prise en charge pour evaluer la capacite d'isolement, an isolation-register review; SitReps 024-026 (7-9 June) are consecutive and published, so the 8 -> 9 June step is clean. The au-lit stock is read from SitRep 026 directly because treatment_aulit_history begins 13 June (Tableau 6), so the 9 June break is not corroborated by that block but by the isolement table in the report itself. 2026-06-19: the occupancy (Fin J) steps 18 June 416 -> 19 June 361, and the 19 June Tableau 6 start-of-day stock au-lit (J-1) 342 confirms a -74 reclassification against the 18 June Fin J 416 (treatment_aulit_history), the largest au-lit-vs-previous-Fin-J gap in the series. The 27 and 29 June steps (419 -> 502 -> 609) each cross an unpublished SitRep (043 on 26 June, 045 on 28 June), so they are two-day increments confounded with real growth rather than a clean reclassification and are left out. 2026-07-14: the 14 July start-of-day au-lit (J-1) 694 (SitRep 061 Tableau 6 Ituri 541 + Nord-Kivu 149 + Tshopo 4) is -59 below the 13 July Fin J 753 (SitRep 060), a clean one-day step (SitReps 059/060/061 are consecutive published vintages) comparable to the 19 June -74. The drop is concentrated in the suspected pool (dont suspects 507 -> 466 = -41 while dont confirmes 246 -> 270 = +24), the de-registration signature, not a fall in confirmed cases."

# Manual, opt-in retrospective harmonisation-break days for the CONFIRMED
# streams. Each listed date is a day on which INSP integrated a harmonised
# provincial base, so the cumulative confirmed headline steps by far more than
# that day's own notifications and the between-vintage increment the confirmed
# likelihood fits is mostly retrospective backlog rather than incidence.
# Two things happen on a listed day (`confirmed_cases_model`):
#  - the day is DE-ANCHORED from the laboratory positivity denominator. Its
#    24h `analysed` count is not used, so the reattached cases never enter the
#    BetaBinomial numerator as same-day positives (on 22 July that would have
#    been 369 positives of 414 analysed, an 89% positivity against the 23%
#    actually reported). The day falls back to the modelled-volume
#    NegativeBinomial branch like any unanchored late vintage.
#  - a single level step is fitted into that window's MODELLED confirmed mean,
#    sampled non-centred around the PUBLISHED discrepancy: the vintage
#    increment minus the printed 24h count (`gross_cases`/`gross_deaths`), so
#    369 - 97 = 272 cases and 236 - 62 = 174 deaths on 22 July.
#    `confirmed_break_sd` (default 25) is then only the residual uncertainty
#    about how much of that discrepancy is truly retrospective rather than
#    coincident same-day incidence, so the fit partitions the observed
#    increment into reporting artefact vs real incidence with uncertainty
#    rather than attributing all of it to either.
# Use it only for a documented, report-acknowledged base integration, not for
# ordinary day-to-day reporting noise, which the NegativeBinomial surveillance
# dispersion already absorbs. The step is symmetric because a harmonisation can
# revise DOWN as well as up (SitRep 065, 18 July: +83 gross vs +77 net).
# Filtered to the cut-off like the histories; empty -> no sampled step, a no-op.
# See issue #484.
[confirmed_break_dates]
value  = ["2026-07-22"]
gross_cases  = [97]
gross_deaths = [62]
source = "Retrospective harmonisation-break days for confirmed_case_history / confirmed_death_history: days whose cumulative headline step is acknowledged by the report itself to be mostly a provincial base integration rather than 24h notifications. 2026-07-22 (SitRep 069): the page-1 headline is asterisked `Harmonisation de donnees avec les provinces de l'Ituri et du Nord-Kivu a la date du 22 juillet 2026`, and the report states explicitly that `les augmentations importantes observees dans les cumuls resultent principalement de l'integration des bases provinciales harmonisees et ne refletent pas uniquement les nouvelles notifications des dernieres 24 heures`. The cumulative confirmed steps +369 (2536 -> 2905) against a printed 24h new-confirmed count of +97 (Ituri 73, Nord-Kivu 18, Haut-Uele 6), and confirmed deaths +236 (1033 -> 1269) against +62 gross. Three independent checks agree the step is retrospective rather than real incidence: the Tableau 6 in-care death outflow that day is only 32; the confirmed-in-care stock barely moves (274 -> 285) while the cumulative gains 369; and SitRep 070 the next day returns to +68 gross = +68 net, so it is a one-day event and not a level shift in incidence. Without the break day the 24h analysed denominator published for 22 July (414) pairs with the +369 increment in the laboratory positivity likelihood, giving an implied 89,1% positivity against the 23,4% (97/414) actually reported - the most extreme observation in the positivity series, and almost entirely artefact. Note the existing inclusion rule (confirmed increment <= analysed) PASSED this day with 45 to spare: that rule guards against an impossible denominator, not a harmonisation, so it offers no protection here. SitRep 065 (18 July) is the other known harmonisation (Haut-Uele/Nia-Nia reattachment) but is NOT listed, and the bar is stated for BOTH streams because a break day applies to cases and deaths alike: +83 gross vs +77 net cases and +40 gross vs +37 net deaths. Both net steps are SMALLER than their gross 24h counts, so the increment likelihood is if anything under-fed rather than over-fed, and both discrepancies (6 cases, 3 deaths) are well inside the surveillance dispersion. The two streams moving down together is what a transfer between provinces looks like (Haut-Uele's provincial cumulative was revised to 16 cases and 10 deaths) rather than a base integration, which adds to both. Added per issue #484. `gross_cases` and `gross_deaths` are the PRINTED 24h new-confirmed counts on each break day (page-1 tile: 22 July +97 cases = Ituri 73 + Nord-Kivu 18 + Haut-Uele 6, and +62 deces = Ituri 45 + Nord-Kivu 14 + Haut-Uele 3). They make the fitted step DATA-DERIVED rather than a guessed prior width: the model centres each step on the observed discrepancy (the vintage increment minus the printed gross count, so 369 - 97 = 272 cases and 236 - 62 = 174 deaths on 22 July) and samples around it with `confirmed_break_sd`, which is now only the residual uncertainty about how much of that discrepancy is truly retrospective rather than coincident same-day incidence - not the magnitude of the harmonisation itself, which the report publishes. Both arrays must be the same length as `value` and are filtered to the cut-off with it."

# --- Tableau 6 occupancy split: confirmed-in-care vs suspect-in-care ------
# The `Patients en isolement (Fin J)` occupancy stock (= isolation_history)
# is published with a two-row breakdown from SitRep 030 (13 June): `dont
# confirmes (NC+AC)` (laboratory-confirmed patients currently in a bed) and
# `dont suspects` (admitted patients not yet confirmed). The two rows sum to
# the reported total occupancy each day, which equals the isolation_history
# stock - the split closes exactly:
#   dont confirmes + dont suspects = Patients en isolement (Fin J).
# These are census (prevalence) sub-stocks, NOT flows: each is the count of
# patients of that class occupying a bed at the end of the reporting day. They
# refine the treatment-flow submodel (`treatment_flow_model`), which fits the
# TOTAL occupancy from 1 June and splits it into the two sub-stocks on the
# 13-23 June overlap where the breakdown is published (a per-day total-OR-split
# switch: the total backbone carries the earlier window). Both are optional: an
# absent or empty block falls back to the total-occupancy likelihood.

