source = "INSP situation reports 1-11 June 2026 (SitReps 018, 021-028) 24h LABORATOIRE block, read from the PDFs; recorded in the notes column of data/insp_sitrep_scanned.csv. 1 Jun (018) 76 national; 4 Jun (021) Ituri 199 + Nord-Kivu 57 = 256 (Nord-Kivu 118 pending excluded); 5 Jun (022) Ituri 109 + Nord-Kivu 11 + Sud-Kivu 6 = 126; 6 Jun (023) Ituri 94 + Nord-Kivu 6 + Sud-Kivu 6 = 106 (Nord-Kivu 193 pending excluded); 7 Jun (024) Ituri 63 + Sud-Kivu 4 = 67 (Nord-Kivu 183 pending for reagents excluded); 8 Jun (025) Ituri 115 + Sud-Kivu 6 = 121 (Nord-Kivu 146 pending for reagents excluded); 9 Jun (026) Ituri 54 + Nord-Kivu 12 + Sud-Kivu 2 = 68 (Nord-Kivu 182 pending for reagents excluded); 10 Jun (027) Ituri 109 (24h block Ituri-only; national confirmed increment 41 ≤ 109); 11 Jun (028) Ituri 35 (Nord-Kivu 172 pending >5 days and Sud-Kivu none, so 35 is the complete national analysed-that-day; confirmed increment 13 ≤ 35). 29-31 May (015-017), 2 Jun (019, Ituri-only) and 3 Jun (020, per-zone) left out: ambiguous or partial scope."

