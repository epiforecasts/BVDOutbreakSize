# Manual, opt-in occupancy reclassification-break days. Each listed date is a
# day on which the treatment-flow submodel fits a single level step into the
# modelled occupancy mean (`treatment_flow_model` / `cumulative_occupancy_
# offset`), letting the modelled occupancy track a between-report measurement-
# basis discontinuity in the observed `isolation_history` series without
# bending Rt to chase it. Use it only for a known, persistent basis change
# (e.g. the day the occupancy series switches from Tableau 6 provincial sums to
# the page-1 headline, or a documented DHIS2 reclassification), not day-to-day
# reporting noise, which the NegativeBinomial occupancy dispersion already
# absorbs. Each step is sampled, centred on zero with a weakly informative
# prior (`occupancy_break_sd`, default 25 beds), so the fit partitions it into
# reporting artifact vs real demand. Filtered to the cut-off like the
# histories; empty → no-op.
[occupancy_break_dates]
value  = ["2026-06-09", "2026-06-19"]
source = "Occupancy reclassification-break days: documented, non-confounded between-report basis changes in isolation_history where the reported start-of-day in-bed stock (Patients au lit (J-1)) falls below the previous report's end-of-day occupancy (Patients en isolement Fin J) by more than the day's admissions and discharges can bridge, a reclassification the smooth inflow-through-survival demand cannot reproduce. Both fall on consecutive published SitReps (no intervening unpublished vintage), so each is a clean one-day step rather than a two-day increment confounded with growth. 2026-06-09: the Fin J occupancy steps 8 June 297 -> 9 June 260 (-37) during a growing outbreak, and the 9 June start-of-day au-lit (J-1) 268 (SitRep 026 isolement table Ituri 245 + Nord-Kivu 17 + Sud-Kivu 6 = 268) is -29 below the 8 June Fin J 297 (SitRep 025), against near-exact reconciliation on the neighbouring days (7 June au-lit 283 vs 6 June Fin J 283 = 0; 8 June 310 vs 7 June 309 = +1; 10 June 262 vs 9 June 260 = +2). The drop is concentrated in the suspected pool: dont suspects 184 (SitRep 025, 8 June) -> 143 (SitRep 026, 9 June) = -41 while dont confirmes 113 -> 117 = +4, a de-registration of ruled-out suspects, not a fall in confirmed cases. It coincides with the first Taux d'occupation print (65.0% on 9 June) and a SitRep 026 mission conjointe surveillance / prise en charge pour evaluer la capacite d'isolement, an isolation-register review; SitReps 024-026 (7-9 June) are consecutive and published, so the 8 -> 9 June step is clean. The au-lit stock is read from SitRep 026 directly because treatment_aulit_history begins 13 June (Tableau 6), so the 9 June break is not corroborated by that block but by the isolement table in the report itself. 2026-06-19: the occupancy (Fin J) steps 18 June 416 -> 19 June 361, and the 19 June Tableau 6 start-of-day stock au-lit (J-1) 342 confirms a -74 reclassification against the 18 June Fin J 416 (treatment_aulit_history), the largest au-lit-vs-previous-Fin-J gap in the series. The 27 and 29 June steps (419 -> 502 -> 609) each cross an unpublished SitRep (043 on 26 June, 045 on 28 June), so they are two-day increments confounded with real growth rather than a clean reclassification and are left out."

