# Patients currently in isolation/hospitalisation: a daily count of how many
# patients are in a bed. This is the headline "Patients en isolement -
# hospitalisation" figure on page 1 of the confirmed-based SitReps (SitReps
# 018-028, 1-11 June), the count of patients (confirmed plus suspected)
# physically in an isolation/treatment bed at the end of the reporting day,
# cross-checked against the Tableau IV "Patients en isolement (Fin J)"
# provincial totals. A patient enters the bed when reported as a suspect and
# leaves on discharge (recovery, death or rule-out), so the count is the
# admission inflow convolved with a length-of-stay survival. The model fits
# it with the length-of-stay observation submodel
# (`treatment_admission_model`): a proportion of the reported suspects are
# admitted, the BVD ones staying for a sampled treatment length-of-stay and
# the non-BVD ones leaving once their negative result returns (after the
# report-to-receipt laboratory delay), so the bed count is a BVD/background
# mixture and its day-by-day level and lag identify the admission proportion
# and the treatment stay. It is scored as a per-day count against the
# modelled count on each report day (never differenced), with its own
# dispersion. SitReps 016-017 (30-31 May) print a DIFFERENT column, "Cas
# suspects en isolement" (suspects only, 101 then 104), relabelled to the
# all-patients "Patients en isolement" from SitRep 018; the two are not the
# same quantity, so the fitted series begins 1 June (SitRep 018) where the
# all-patients definition is stable.
[isolation_history]
dates  = ["2026-06-01", "2026-06-02", "2026-06-03", "2026-06-04",
          "2026-06-05", "2026-06-06", "2026-06-07", "2026-06-08",
          "2026-06-09", "2026-06-10", "2026-06-11"]
values = [173, 206, 233, 258, 267, 283, 309, 297, 260, 262, 315]
source = "INSP situation reports 1-11 June 2026 (SitReps 018-028) page-1 headline `Patients en isolement - hospitalisation`, read from the PDFs and cross-checked against the Tableau IV `Patients en isolement (Fin J)` provincial totals; recorded in the patients_isolated column of data/insp_sitrep_scanned.csv. Daily isolation/hospitalisation occupancy (stock): 173, 206, 233, 258, 267, 283, 309, 297, 260, 262, 315 on 1-11 June. SitReps 016-017 (30-31 May) report the narrower `Cas suspects en isolement` (suspects only, 101, 104), a different quantity, so the all-patients series begins 1 June."

# Cumulative recovered among laboratory-confirmed cases ("cumul guéris"):
# the running total of confirmed cases recorded as recovered/discharged,
# printed on page 1 of the confirmed-based SitReps from 6 June (SitReps
# 023-028). This is a CUMULATIVE count (non-decreasing), fitted as survivors
# among the modelled confirmed cases: the daily confirmed incidence scaled by
# a recovery probability (the confirmed-case survival fraction) and convolved
# with a confirmation-to-recovery delay, an estimate_secondary incidence
# stream (`recovered_model`). Its between-vintage increments are scored like
# the confirmed and confirmed-death series. The confirmation-to-recovery
# convolution right-censors recoveries not yet resolved by the cut-off, so the
# small observed totals (12 -> 32 over 6-11 June) are consistent with a high
# eventual survival fraction. SitReps 021-022 (4-5 June) do not yet print a
# cumul guéris total, so the series begins 6 June.
