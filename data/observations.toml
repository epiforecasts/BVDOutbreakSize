# Cumulative national confirmed-death totals (front-page `Cumul décès
# parmi les confirmés`). First published in the SitRep 012 revised
# re-issue (26 May); 17 on 26-28 May. INSP flags these as
# under-estimated because diagnostic confirmation is delayed. The series
# is flat over the fitted window (the jump to 42 on 29 May and
# subsequent values 48, 60, 62, 64, 82, 86, 91 on 31 May-6 June reflect
# late confirmation; recorded in data/insp_sitrep_scanned.csv as data
# beyond the cut-off). Recorded for completeness as a time series; the
# cut-off `confirmed_deaths` scalar (17) is derived from the final
# vintage at load time. The model does not currently fit a confirmed-
# death stream (the deaths likelihood uses suspected deaths).
[confirmed_death_history]
dates  = ["2026-05-26", "2026-05-27", "2026-05-28", "2026-05-29",
          "2026-05-30", "2026-05-31", "2026-06-01", "2026-06-02",
          "2026-06-03", "2026-06-04", "2026-06-05", "2026-06-06"]
values = [17, 17, 17, 42, 42, 48, 60, 62, 64, 82, 86, 91]
source = "INSP situation reports 26 May - 6 June 2026 (SitReps 012_v2-023), front-page `Cumul décès parmi les confirmés`, read from the PDFs; recorded in data/insp_sitrep_scanned.csv. Flat at 17 through 28 May, then late-confirmation catch-up: 42 (29-30 May), 48 (31 May), 60 (1 June), 62 (2 June), 64 (3 June), 82 (4 June), 86 (5 June), 91 (6 June)."

