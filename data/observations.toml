# Cumulative national confirmed-case totals across INSP situation-report
# vintages (the lab-section `Cumul positifs`, equal to the front-page
# `Cumul cas confirmés`). Same caveats as `reported_case_history`: the
# daily likelihood fits the between-vintage increments. The 23-28 May
# values are the report totals; 18-22 May use the early-report baseline.
# The final vintage (28 May, 210) is the cut-off confirmed total the
# model uses (derived at load time), paired with `tests_analysed_history`
# for the per-test positivity (210/755 ≈ 28%). The series runs to the
# cut-off; the confirmed-based format from 29 May (263, 282, 321, 344,
# 363, 381, 452, 488, 515 on 29 May-6 June; SitReps 015-023) is recorded
# in data/insp_sitrep_scanned.csv but not added here, since national
# testing stops after 28 May and the model anchors confirmed cases
# through the laboratory positivity.
[confirmed_case_history]
