# Cumulative national suspected-case totals across INSP situation-report
# vintages. We trust each vintage's cumulative-at-date count but not the
# per-case timing (heavy backfill; the report date is the publication
# date, not symptom onset), so the model fits the between-vintage
# increments rather than the nested cumulative totals. The 23-26 May
# values are the INSP report headline totals (SitReps 009-012); the
# 18-22 May values predate that headline format and retain the WHO AFRO
# / early-report baseline (18 May = 516 matches WHO joint sitrep 01).
# FROZEN at 26 May (matches `reported_cases`), two days before the 28 May
# cut-off: from SitRep 013 (27 May) INSP revised the suspected count
# downward (906 then 349) as suspects were reclassified, so the series is
# not extended past its last stable vintage and is missing thereafter.
[reported_case_history]
dates  = ["2026-05-18", "2026-05-19", "2026-05-20", "2026-05-21",
          "2026-05-22", "2026-05-23", "2026-05-24", "2026-05-25",
          "2026-05-26"]
values = [516, 575, 672, 745, 872, 904, 906, 998, 1077]
source = "INSP situation reports 18-26 May 2026, read from the PDFs (https://github.com/INRB-UMIE/Ebola_DRC_2026, data/insp_sitrep/raw; recorded in data/insp_sitrep_scanned.csv). National cumulative suspected cases from each report's headline; the 18-22 May points use the WHO AFRO / early-report baseline."

# The confirmed-case and laboratory streams are held as time series
# only; the cut-off scalars the model uses (`confirmed_cases`,
# `cumulative_tests_analysed`) are derived from the final vintage of the
# corresponding history at load time, so the series are the single
# source of truth.

# Cumulative national laboratory throughput across INSP situation-report
# vintages (section IV.3 LABORATOIRE Tableau IV): specimens received and
# specimens whose analysis has completed. The 23-26 May points are
# SitReps 009-012; 27-28 May are SitReps 013-014. The 28 May cut-off is
# received 883, analysed 755. The model uses the final `tests_analysed`
# value (755) as the cut-off tests total, paired with the confirmed
# count for the per-test positivity (210/755 ≈ 28%) and the
# right-truncation handle. From 29 May the lab section reports Bunia-only
# or 24h figures, not a national cumulative, so these series end at the
# cut-off.
[tests_received_history]
dates  = ["2026-05-23", "2026-05-24", "2026-05-25", "2026-05-26",
          "2026-05-27", "2026-05-28"]
values = [418, 431, 431, 662, 774, 883]
source = "INSP situation reports 23-28 May 2026 (SitReps 009-014) section IV.3 LABORATOIRE Tableau IV `Échantillons reçus` (cumul), read from the PDFs; recorded in data/insp_sitrep_scanned.csv."

[tests_analysed_history]
dates  = ["2026-05-23", "2026-05-24", "2026-05-25", "2026-05-26",
          "2026-05-27", "2026-05-28"]
values = [211, 295, 295, 403, 648, 755]
