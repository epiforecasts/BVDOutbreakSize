# the notes column of data/insp_sitrep_scanned.csv.
# Dividing the same-day occupancy (260, 262, 315, 359, 363, 376, 379, 383, 416, 361, 365, 371, 387, 408, 385, 419) by the rate gives the
# bed count: 400, 410, 452, 433, 433, 433, 433, 409, 441, 409, 441, 441, 504, 504, 514, 519. The isolation submodel
# (`treatment_admission_model`) treats these as noisy observations of a
# single national bed capacity `C`, the ceiling the latent bed demand
# saturates against. Capacity is being expanded (SitRep 030 records 164
# mattresses, 140 beds received and new treatment centres opening), so a
# single constant `C` is approximate. A single national capacity is also a
# limitation rather than just an approximation: it cannot represent the local
# saturation the supply constraint actually operates at (Ituri at 93.9% on
# 13 June vs Sud-Kivu 21.9%), which the model does not currently carry the
# per-province inflow to split.
