# Observations for the 2026 DRC Bundibugyo virus disease outbreak.
# Each entry pairs a numeric value with a short source citation;
# both are loaded by `load_observations` and printed in the
# walkthrough.
#
# DRC counts are the NATIONAL cumulative figures reported in the INSP
# (DRC Institut National de Santé Publique) situation reports for the
# 17th Ebola epidemic (https://insp.cd/ebola-17eme-epidemie/),
# transcribed by INRB-UMIE (https://github.com/INRB-UMIE/BDBV2026-Data).
# Two sources feed this manifest:
#  - The cumulative confirmed-case and confirmed-death series come from
#    the INRB-UMIE `national_*` daily CSVs (data/insp_sitrep/processed),
#    their clean national headline series. These are regenerated and
#    spot-confirmed against our own scan by scripts/confirm_insp_data.jl.
#  - Every other stream (the suspected totals, the laboratory cumulatives,
#    the post-cut-off 24h analysed volume, the daily new-suspect inflow,
#    isolation occupancy, bed capacity and recoveries) is read directly
#    from the situation-report PDFs (data/insp_sitrep/raw; fetched by
#    scripts/download_sitreps.jl) and recorded in
#    data/insp_sitrep_scanned.csv. These use the report headline and
#    laboratory-section totals rather than the per-zone daily CSVs, whose
#    zone sums understate the national totals (they drop counts that
#    cannot be attributed to a zone, `échantillons sans fiche`, or that a
#    zone did not report, `ND`). The scanned figures were read from the
#    PDFs via an LLM agent and independently re-scanned by a second agent
#    (see the methods section of the walkthrough).
#
# Where a report's headline total disagrees with the sum of its own
# per-zone table, we take the auditable zone-table sum: the 23 May report
# (SitRep 009) prints 119 cumulative suspected deaths in its headline,
# but its per-zone rows sum to 220, the value used here. Figures are
# keyed by the report's `date de rapportage`. The 18-22 May points
# predate the national cumulative-headline format and retain the WHO AFRO
# / early-report baseline (18 May = 516 cases, 131 deaths, matching the
# WHO AFRO joint sitrep 01).
#
# Cut-off: 28 May 2026 (SitRep 014). This is the last vintage with a
# coherent national laboratory total, which the confirmed-case stream is
# anchored to (confirmed cases paired with cumulative tests analysed for
# the per-test positivity). From SitRep 013 (27 May) INSP began revising
# the suspected counts downward as suspects were investigated, and from
# the confirmed-based format (SitReps 016-017, 30-31 May) it stopped
# publishing national cumulative suspected and laboratory totals. So:
#  - the suspected streams (reported_cases, total_deaths and their
#    histories) are FROZEN at their last stable vintage, 26 May, two days
#    before the cut-off, and are missing thereafter;
#  - the confirmed-case and laboratory streams run to the 28 May cut-off;
#  - confirmed deaths and the post-cut-off confirmed-case figures (263,
#    282, 321, 344, 363, 381, 452, 488, 515, 550, 598, 635, 676, 689, 782,
#    808, 837, 875, 896, 933, 956, 1003, 1048, 1094, 1118, 1155, 1203, 1274, 1333, 1406, 1460, 1502, 1528, 1561, 1624, 1708, 1759 on 29 May-7 July; SitRep 029 / 12 June,
#    SitRep 043 / 26 June and SitRep 045 / 28 June were not published
#    upstream, so the series steps 11 June -> 13 June, 25 June -> 27 June
#    and 27 June -> 29 June; SitRep 047 / 30 June follows 046 / 29 June,
#    SitRep 048 / 1 July follows 047 / 30 June, SitRep 049 / 2 July
#    follows 048 / 1 July, SitRep 050 / 3 July follows 049 / 2 July,
#    SitRep 051 / 4 July follows 050 / 3 July, SitRep 052 / 5 July follows
#    051 / 4 July, SitRep 053 / 6 July follows 052 / 5 July and SitRep 054 /
#    7 July follows 053 / 6 July directly, with no gap)
#    are recorded in
#    data/insp_sitrep_scanned.csv as data beyond the cut-off,
#    but are not fitted, because the model anchors confirmed cases through
#    the laboratory positivity and national testing totals stop after
#    28 May.

