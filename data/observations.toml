# Start-of-day in-bed count (`Patients au lit (J-1)`, national Ensemble),
# the bed stock at the start of each reporting day before that day's
# admissions and discharges. It is the same patient stock as the
# end-of-day `Patients en isolement (Fin J)` occupancy, but read at the
# start of the day, so `au-lit(J-1)(t)` should equal the previous report
# day's `isolation_history` occupancy. Where it does not, the gap is a
# between-report DHIS2 reclassification jump (e.g. the 19 June drop from
# 416 to 342), a discontinuity the smooth inflow-through-survival demand
# cannot reproduce. The treatment-flow submodel uses these gaps to identify
# the break days (a material `|gap|`) and to centre a fitted break-step
# prior; the sampled steps accumulate into a cumulative offset `Δ(t)` added
# to the modelled occupancy mean, so the modelled occupancy tracks the
# reclassified observed series and the residual stays smooth (the fit no
# longer bends Rt to chase the reclassification) while still partitioning
# each step into reporting-artifact vs real demand with uncertainty.
# Optional: an absent or empty block leaves Δ = 0, a no-op.
