and coincides with the Nord-Kivu cas-suspects-du-jour cell (90) in the same Tableau 3, so it reads as a data-entry / carry-forward error rather than a genuine 24h count. Following the 23 May (SitRep 009) precedent of taking the auditable Tableau zone-row sum when the front-page headline is a data-entry error (there 220 over the erroneous 119), the Tableau 3 zone-sum 77 is used and the headline 90 is recorded as the discrepancy. The INRB-UMIE national_cumulative_suspected_deaths DRC daily-new value 90 transcribes the same page-1 tile, so it is not an independent cross-check. The suspect-CASE count 301 is unaffected: it is internally consistent (Tableau 3 Ituri 211 + Nord-Kivu 90 = 301, matching the tile and narrative) and changed from 29 June's 309, so it stands as a genuine fresh daily value. SitRep 048 (1 July) directly follows 047 (30 June), no gap; prints cas suspects du jour 150 (41 deces), a fresh distinct value (down from the disputed 90/77 on 30 June); the 41 suspect-deaths headline agrees with the INRB-UMIE national_cumulative_suspected_deaths DRC daily-new value 41, so 41 is used with no discrepancy this vintage. SitRep 049 (2 July) directly follows 048 (1 July), no gap; prints cas suspects du jour 213 (63 deces); the 63 suspect-deaths headline agrees with the report's own Tableau 3 alertes validees Decedees row (Ituri 45 + Nord-Kivu 18 + Sud-Kivu 0 = 63) and with the INRB-UMIE national_cumulative_suspected_deaths DRC daily-new value 63, so 63 is used with no discrepancy this vintage. SitRep 050 (3 July) directly follows 049 (2 July), no gap; prints cas suspects du jour 185 (67 deces); the 67 suspect-deaths headline agrees with the INRB-UMIE national_cumulative_suspected_deaths DRC daily-new value 67, so 67 is used with no discrepancy this vintage. SitRep 051 (4 July) directly follows 050 (3 July), no gap; prints cas suspects du jour 354 (110 deces); the 110 headline agrees with the report's Tableau 3 alertes validees Decedees row (Ituri 76 + Nord-Kivu 34 + Sud-Kivu 0 = 110) and the INRB national_cumulative_suspected_deaths DRC daily-new value 110, so 110 is used with no discrepancy (added here to close the 4-7 July gap: on main this series had been left at 3 July while the other daily streams advanced to 7 July). SitRep 052 (5 July) prints cas suspects du jour 135 (23 deces); 23 used. SitRep 053 (6 July) prints cas suspects du jour 237 (70 deces); 70 used. SitRep 054 (7 July) prints cas suspects du jour 304 (92 deces); 92 used. SitRep 055 (8 July) prints cas suspects du jour 227 (60 deces); 60 used. Each of the 4-8 July suspect-death headlines agrees with the INRB-UMIE national_cumulative_suspected_deaths DRC daily-new series (no discrepancy). 81 on 9 July (SitRep 056; headline 81, Tableau 3 Decedees Ituri 59 + Nord-Kivu 22 + Sud-Kivu 0 = 81) and 91 on 10 July (SitRep 057; headline 91, Tableau 3 Ituri 65 + Nord-Kivu 26 + Sud-Kivu 0 = 91); both agree with the national_cumulative_suspected_deaths DRC daily-new value. 91 on 11 July (SitRep 058 page-1 tile cas suspects du jour 299 (91 deces)), matching the INRB-UMIE national_cumulative_suspected_deaths DRC daily-new value 91; the report's own Tableau 3 alertes validees Decedees is a fresh distinct field count 70 (Ituri 48 + Nord-Kivu 22 + Sud-Kivu 0 = 70), differing from the page-1 headline 91 which is used per methodology (as on 30 June the Tableau 3 zone-sum and the tile diverge; here the DHIS2-consolidated page-1 tile 91 is taken, consistent with the INRB CSV)."

