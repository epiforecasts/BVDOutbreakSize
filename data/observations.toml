# Daily new suspected deaths: the per-day count of suspected deaths in the
# preceding 24h, printed alongside the daily new-suspect count in the
# confirmed-based SitReps as "cas suspects du jour N (M deces)". This is the
# post-26 May continuation of the suspected-death signal, mirroring
# `suspected_daily_history` for cases. The national CUMULATIVE suspected-death
# total was frozen at 26 May (see `death_history`) once INSP stopped publishing
# a national suspected-death headline, but the daily new-suspected-death inflow
# is a genuine per-day count that never falls, so it can be fitted directly.
# The model scores each count against the modelled daily suspected-death series
# (the CFR-weighted onset-to-death convolution plus any non-BVD background) on
# its report day, sharing the surveillance dispersion with the frozen
# cumulative stream. The days (7-23 June) fall strictly after the cumulative
# series ends (26 May), so the two suspected-death likelihoods cover disjoint
# days and do not double-count. The series begins 7 June (SitRep 024), three
# days after the new-suspect series: SitReps 021-023 (4-6 June) print the
# new-suspect count but not the deaths-of-the-day figure, and SitRep 029
# (12 June) was not published upstream.
