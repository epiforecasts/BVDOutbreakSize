[deps]
Runic = "62bfec6d-59d7-401d-8490-b29ee721c001"

# Pinned to one exact version, not a range. Formatting is a fixed point of a
# specific formatter: a new Runic release can reformat unchanged files and
# turn `test/package/CodeFormatting.jl` red with no commit to blame. This
# directory has no committed Manifest, so every entry point resolves afresh
# and a range would let two of them apply different styles to one tree.
#
# Write it as a single `=` string. The JuliaFormatter pin this replaced read
# `"=2.12.0, 2.12"`, which Julia parses as a union of an exact version and a
# caret range, so it admitted every 2.x at or above 2.12.0 and pinned nothing.
#
# `.pre-commit-config.yaml` declares the same version for the hook's own
# environment, which never reads this file. `test/package/CodeFormatting.jl`
# fails if the two drift. Bump both together, reformatting the tree in the
# same commit.
[compat]
Runic = "1.11"
