version: "3"

# Common development tasks. Run `task --list` to see them.

tasks:
  refresh-releases:
    desc: >
      Pull the published per-release outbreak-size estimates from the
      tagged results releases into data/released_estimates.csv. Needs the
      `gh` CLI authenticated against the repo.
    cmds:
      - julia --project=scripts scripts/refresh_releases.jl {{.CLI_ARGS}}

  release-notes:
    desc: >
      Print the release notes for the version in Project.toml, taken from the
      newest section of docs/src/news.md. This is what an `@release` comment
      publishes, so the notes can be read before anything is cut. Pass
      `-- next patch` to see the following version, or `-- open patch` to
      write the bump and the new section locally.
    cmds:
      - julia --project=scripts scripts/release_notes.jl
        {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}notes{{end}}

  download-sitreps:
    desc: >
      Download the MVE situation-report PDFs from the INSP site (insp.cd,
      the source of truth) into data/sitrep_pdfs/ (git-ignored) for direct
      scanning. Skips reports already present, so it fetches only new
      sitreps.
    cmds:
      - julia --project=scripts scripts/download_sitreps.jl {{.CLI_ARGS}}

  confirm-data:
    desc: >
      Cross-check the hand-scanned confirmed-case and confirmed-death
      totals in data/insp_sitrep_scanned.csv against the INRB-UMIE national
      cumulative series. Reports the dates each source carries alone and
      exits non-zero on any disagreement the script does not already
      document as a mirror transcription error.
    cmds:
      - julia --project=scripts scripts/confirm_insp_data.jl {{.CLI_ARGS}}

  province-tableau1:
    desc: >
      Regenerate the [province_confirmed_history] and [province_death_history]
      blocks for data/observations.toml by scanning Tableau 1 of the INSP
      situation reports (per-province confirmed cases AND deaths). Fails
      unless the per-province figures sum exactly to the national
      confirmed_case_history and confirmed_death_history on every date. The
      deaths column is what makes the per-province ascertainment identifiable.
      Needs the PDFs (`task download-sitreps`) and pdftotext.
    cmds:
      - julia --project=scripts scripts/scan_province_tableau1.jl {{.CLI_ARGS}}

  province-lab-data:
    desc: >
      Regenerate the [province_lab_daily_history] block for
      data/observations.toml by scanning section 4.3 (Laboratoire) of the
      INSP situation-report PDFs for the per-province samples analysed and
      positives. Validates that the per-province analysed counts sum exactly
      to the national tests_analysed_daily_history on every date (they are an
      exact partition of it) and exits non-zero on any disagreement. Needs
      the PDFs (`task download-sitreps`) and pdftotext.
    cmds:
      - julia --project=scripts scripts/scan_province_lab.jl {{.CLI_ARGS}}

  benchmark:
    desc: >
      Run the per-component AD gradient benchmark suite and save the results
      to results.json (pass another path to change it). Times one
      log-density evaluation and one gradient per model component per AD
      backend. Set BVD_BENCH_JOINT=true to add the full bvd_joint, which
      costs ~18 min of cold compile on its own, and BVD_BENCH_ENZYME=true
      to add the Enzyme backend, which did not finish inside a 90 minute
      CI job.
    cmds:
      - julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
      - julia --project=benchmark benchmark/run.jl {{.CLI_ARGS}}

  benchmark-compile:
    desc: >
      Measure the cold AD-compile cost of each model component, one fresh
      process each, and save it to compile.json (pass another path to change
      it). This is the cost `task benchmark` cannot see: Mooncake builds the
      reverse rule when the log-density function is constructed, which is
      about 87% of a component's cold build and 969 s of the full joint's
      1095 s. Set BVD_BENCH_JOINT=true to add the joint.
    cmds:
      - julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
      - julia --project=benchmark benchmark/compile.jl {{.CLI_ARGS}}

  benchmark-pair:
    desc: >
      Reproduce the CI comparison locally: benchmark two revisions of this
      repository in one process and write the PR comment. Usage:
      task benchmark-pair -- <base-rev> <head-rev>. Worktrees go under
      .benchmark-worktrees/ and results under benchmark-results/. Costs
      roughly twice a single `task benchmark`.
    cmds:
      - ./scripts/run_benchmark_pair.sh {{.CLI_ARGS}}

  docs:
    desc: >
      Build the full docs site locally: render both literate pages (analysis
      and sensitivity) from the cached fits and assemble the Vitepress site.
      Missing fits are computed and cached under logs/fit_cache on first run;
      set BVD_REFIT=all to refit. deploydocs is a no-op outside CI.
    cmds:
      - BVD_DOCS_STAGE=all julia --project=docs docs/make.jl {{.CLI_ARGS}}

  docs-main:
    desc: >
      Render just the main analysis page (docs/src/analysis.md) from the
      cached fits, without assembling the site. Fast iteration on the main
      page.
    cmds:
      - BVD_DOC_PAGE=analysis julia --project=docs docs/execute.jl {{.CLI_ARGS}}

  docs-sensitivity:
    desc: >
      Render just the sensitivity page (docs/src/sensitivity.md) from the
      cached fits, without assembling the site.
    cmds:
      - BVD_DOC_PAGE=sensitivity julia --project=docs docs/execute.jl
        {{.CLI_ARGS}}

  fit:
    desc: >
      Run and cache a single model fit by id (BVD_FIT_ID), matching one CI
      matrix job. List ids with `julia --project=docs docs/fits/list.jl`.
      Example: BVD_FIT_ID=deaths task fit.
    cmds:
      - julia --project=docs docs/fits/one.jl {{.CLI_ARGS}}

  check-convergence:
    desc: >
      Decide whether the cached fits converged well enough to publish, the
      same gate CI runs after the fit matrix. Reads the chains from
      logs/fit_cache without refitting, prints the verdict, the headline
      diagnostics and the parameters responsible, and exits non-zero on a
      failure. Set BVD_CONVERGENCE_IDS to gate fits other than `joint`.
    cmds:
      - julia --project=docs docs/fits/check_convergence.jl {{.CLI_ARGS}}

  fit-all:
    desc: >
      Fit and cache every model in one parallel pass, then `task docs` renders
      from the cache without refitting. Canonical local full build:
      `task fit-all && task docs`.
    cmds:
      - julia --project=docs docs/fits/all.jl {{.CLI_ARGS}}

  format:
    desc: >
      Run Runic over src/, test/, docs/, scripts/, benchmark/ and ext/.
    cmds:
      - ./scripts/run_formatter.sh

  lint:
    desc: Alias for format.
    cmds:
      - task: format

  test:
    desc: Run the full test suite.
    cmds:
      - julia --project=. -e 'using Pkg; Pkg.test()'

  test-quick:
    desc: Run the test suite without the quality (Aqua/JET/format) checks.
    cmds:
      - julia --project=. -e 'using Pkg; Pkg.test(; test_args = ["skip_quality"])'

  tensorboard:
    desc: >
      Launch TensorBoard on the per-fit logs from a dev/report build in this
      worktree. Fit logging is on by default (`BVD_FIT_LOG` unset → `all`), so
      a build writes `logs/tensorboard/<fit>/` and `logs/<fit>.log` without
      any flag; `BVD_FIT_LOG=none` turns it off (CI release builds do this).
      Run this in the same directory you built from. Pins Python 3.12 and
      `setuptools<81` because newer setuptools drops `pkg_resources`, which
      TensorBoard still imports. Needs `uv`.
    cmds:
      - uvx --python 3.12 --with 'setuptools<81' --from tensorboard
        tensorboard --logdir logs/tensorboard {{.CLI_ARGS}}
