<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" font-family="Source Sans Pro, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a97a6"/>
    </marker>
    <style>
      .lat  { fill:#1f4e79; }
      .obs  { fill:#e8eef5; stroke:#9bb4cc; stroke-width:1.5; }
      .lt   { fill:#ffffff; font-weight:600; }
      .ot   { fill:#1f4e79; font-weight:600; }
      .sub  { font-size:13px; font-weight:400; }
      .edge { fill:none; stroke:#8a97a6; stroke-width:2; }
      .elab { fill:#6b7785; font-size:12px; }
      tspan, text { text-anchor:middle; }
    </style>
  </defs>

  <!-- ===== latent spine (top) ===== -->
  <!-- edges between spine boxes -->
  <line class="edge" x1="135" y1="92" x2="298" y2="92" marker-end="url(#arrow)"/>
  <text class="elab" x="216" y="78">cryptic growth</text>
  <text class="elab" x="216" y="64">rate r · m doublings</text>
  <line class="edge" x1="450" y1="92" x2="508" y2="92" marker-end="url(#arrow)"/>
  <line class="edge" x1="760" y1="92" x2="818" y2="92" marker-end="url(#arrow)"/>
  <text class="elab" x="789" y="80">incubation</text>

  <g>
    <rect class="lat" x="20"  y="60" width="115" height="64" rx="8"/>
    <text class="lt" x="77" y="97" font-size="16">single import</text>

    <rect class="lat" x="300" y="60" width="150" height="64" rx="8"/>
    <text class="lt" x="375" y="89" font-size="16">seed 2ᵐ</text>
    <text class="lt sub" x="375" y="109">at renewal start</text>

    <rect class="lat" x="510" y="60" width="250" height="64" rx="8"/>
    <text class="lt" x="635" y="89" font-size="16">infections</text>
    <text class="lt sub" x="635" y="110">Iₜ = Rₜ Σ I₍ₜ₋ₛ₎ gₛ</text>

    <rect class="lat" x="820" y="60" width="150" height="64" rx="8"/>
    <text class="lt" x="895" y="97" font-size="16">symptom onsets</text>
  </g>

  <!-- ===== connectors to observation streams ===== -->
  <!-- from infections (travel branch): exported cases and export deaths -->
  <path class="edge" d="M635,124 Q600,260 585,396" marker-end="url(#arrow)"/>
  <path class="edge" d="M635,124 Q745,255 812,396" marker-end="url(#arrow)"/>
  <!-- from symptom onsets: suspected deaths, reported cases, confirmed cases -->
  <path class="edge" d="M895,124 Q500,210 120,396" marker-end="url(#arrow)"/>
  <path class="edge" d="M895,124 Q640,215 350,396" marker-end="url(#arrow)"/>
  <path class="edge" d="M895,124 Q985,260 1050,396" marker-end="url(#arrow)"/>

  <!-- edge labels above each target box -->
  <text class="elab" x="120"  y="388">onset → death · CFR</text>
  <text class="elab" x="350"  y="388">onset → report · p_drc</text>
  <text class="elab" x="585"  y="388">travel gate · p_uganda</text>
  <text class="elab" x="812"  y="388">travel · onset → death · CFR</text>
  <text class="elab" x="1050" y="388">lab pipeline · positivity</text>

  <!-- ===== observation streams (bottom) ===== -->
  <g>
    <rect class="obs" x="15"   y="398" width="210" height="62" rx="8"/>
    <text class="ot" x="120" y="427" font-size="15">suspected deaths</text>
    <text class="ot sub" x="120" y="447">DRC</text>

    <rect class="obs" x="250"  y="398" width="200" height="62" rx="8"/>
    <text class="ot" x="350" y="427" font-size="15">reported cases</text>
    <text class="ot sub" x="350" y="447">DRC</text>

    <rect class="obs" x="480"  y="398" width="210" height="62" rx="8"/>
    <text class="ot" x="585" y="427" font-size="15">exported cases</text>
    <text class="ot sub" x="585" y="447">Uganda</text>

    <rect class="obs" x="712"  y="398" width="200" height="62" rx="8"/>
    <text class="ot" x="812" y="427" font-size="15">export deaths</text>
    <text class="ot sub" x="812" y="447">Uganda</text>

    <rect class="obs" x="935"  y="398" width="230" height="62" rx="8"/>
    <text class="ot" x="1050" y="427" font-size="15">confirmed cases</text>
    <text class="ot sub" x="1050" y="447">DRC</text>
  </g>
</svg>
