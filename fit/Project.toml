# Lean environment for the per-fit matrix jobs (`docs/fit_one.jl`,
# `docs/list_fits.jl`): just the modelling stack, dropping the docs-only
# packages (Documenter, DocumenterVitepress, Literate, ...) that the fits do
# not need, so those jobs precompile less. The full `docs/Project.toml`
# environment is still used for the `render` job. Note: CairoMakie/Makie come
# in transitively as BVDOutbreakSize's own deps, so making the plotting an
# extension (weakdep) is the follow-up that would trim them here too.
[deps]
BVDOutbreakSize = "7c2a1f8e-9d4b-4a16-bf3e-1f5c8c3a90e2"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
Pkg = "44cfe95a-1eb2-52ea-b672-e2afdf69b78f"
SHA = "ea8e919c-243c-51af-8825-aaa63cd721ce"
Serialization = "9e88b42a-f829-5b0c-bbe9-9e923198166b"

[sources]
BVDOutbreakSize = {path = ".."}

[compat]
Distributions = "0.25"
