name: BVDOutbreakSize pkgimage
description: >-
  Hand the docs environment's compiled BVDOutbreakSize image from the `list`
  job to the later jobs of the same run.

# Compiling BVDOutbreakSize with the docs precompile workload takes ~13 min.
# Every later job restores a `docs-env` depot cache. The image loads only
# against the dependency builds it was compiled with, which are those in the
# depot `list` saves, so the cache prune keeps that depot while the run is
# going (.github/scripts/prune_depot_caches.py). A job that restores another
# depot whose dependencies came from the same builds still loads this image
# rather than the BVDOutbreakSize in that depot, built from other sources.
#
# `save` must run after the environment is precompiled. `restore` must run
# after the depot cache and the pinned manifest are restored and before the
# first Pkg call, since `Pkg.develop` and `Pkg.instantiate` both precompile.
# If the image is missing or does not match the dependencies, Julia
# compiles it.
inputs:
  mode:
    description: '`save` or `restore`.'
    required: true

runs:
  using: composite
  steps:
    - name: Locate the compiled image
      id: locate
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        if [ "$MODE" = save ]; then
          dir="$RUNNER_TEMP/bvd-pkgimage"
          mkdir -p "$dir"
          ji=$(julia --project=docs -e '
            using BVDOutbreakSize
            print(Base.pkgorigins[Base.PkgId(BVDOutbreakSize)].cachepath)')
          cp "$ji" "${ji%.ji}.so" "$dir"
          du -sh "$dir"/*
        else
          dir=$(julia -e 'print(joinpath(DEPOT_PATH[1], "compiled",
            "v$(VERSION.major).$(VERSION.minor)", "BVDOutbreakSize"))')
          mkdir -p "$dir"
        fi
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
    - if: inputs.mode == 'save'
      uses: actions/upload-artifact@v7
      with:
        name: bvd-pkgimage
        path: ${{ steps.locate.outputs.dir }}
        if-no-files-found: error
        # A handoff inside the run, ~100-300 MB each.
        retention-days: 1
    - if: inputs.mode == 'restore'
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: bvd-pkgimage
        path: ${{ steps.locate.outputs.dir }}
    - if: inputs.mode == 'restore'
      name: Report whether the image is usable
      continue-on-error: true
      shell: bash
      # The loading debug log names the check that rejects the image. A
      # dependency built apart from the one the image was compiled against is
      # reported as "Ignoring cache file", not "Rejecting", so keep every
      # line about a cache file.
      env:
        JULIA_DEBUG: loading
      run: |
        set +e
        log="$RUNNER_TEMP/pkgimage-report.log"
        julia --project=docs -e '
          pkg = Base.identify_package("BVDOutbreakSize")
          println("BVDOutbreakSize pkgimage usable: ", Base.isprecompiled(pkg))' \
          > "$log" 2>&1
        echo "julia exited with status $?"
        grep -A8 -e 'pkgimage usable' -e 'cache file' "$log" | head -n 200
        exit 0
