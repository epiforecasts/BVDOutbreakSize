version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # Julia dependency updates. The root "/" is a Julia 1.12 workspace
  # (`[workspace] projects = ["test", "docs"]`), so that entry coordinates the
  # main package, test/, and docs/ together. The remaining CI/tooling
  # environments are NOT workspace members and have their own Project.toml, so
  # they need their own directory entries to be updated.
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/test/jet"
      - "/test/enzyme"
      - "/test/formatter"
      - "/scripts"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "julia"
    groups:
      julia-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # StatsFuns 2.x needs a newer Turing than we pin: Turing 0.45/0.46 caps
      # StatsFuns at <= 1.5.2, so bumping to 2.x makes the environment
      # unsatisfiable. Skip StatsFuns >= 2 until Turing supports it.
      - dependency-name: "StatsFuns"
        versions: [">=2"]
      # Statistics is a Julia stdlib versioned with Julia itself. On Julia LTS
      # (1.10) it ships as 1.10.0, while newer Julia versions ship newer
      # versions. Dependabot would try to pin it to a specific version in
      # test/ and docs/ Project.toml that breaks LTS resolution. Skip it.
      - dependency-name: "Statistics"
