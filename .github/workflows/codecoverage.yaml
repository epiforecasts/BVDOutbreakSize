name: Code coverage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# As in test.yml: a pull request cancels its own earlier run, and on `main` a
# newer push replaces only the run still queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Coverage measures the test suite, so it is gated on the same paths.
  changes:
    name: Decide whether coverage needs to run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.filter.outputs.matched }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit's first parent is the base, which the action
          # diffs against, so the full history is needed rather than a
          # single-commit checkout.
          fetch-depth: 0
      - id: filter
        uses: ./.github/actions/changed-paths
        with:
          label: 'coverage'
          patterns: >-
            ^(src/|ext/|test/|data/|docs/fits/|scripts/|Project\.toml|\.github/(workflows/(test\.yml|codecoverage\.yaml)|actions/changed-paths/))

  # This is also the Julia 1 Linux cell of the test suite, which test.yml
  # leaves out of its matrix, so it runs the `:slow` items too.
  coverage:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    # Below GitHub's 6h job ceiling, as in test.yml.
    timeout-minutes: 150
    # Pinned pkgimage targets, as in test.yml, so a restored depot is not
    # thrown away on a host of another microarchitecture.
    env:
      JULIA_CPU_TARGET: >-
        generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1)
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          # Only a job that finished may write the depot cache; see test.yml.
          save-always: false
      - uses: julia-actions/julia-runtest@v1
        with:
          test_args: skip_quality
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
