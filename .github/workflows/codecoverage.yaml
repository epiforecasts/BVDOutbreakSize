name: Code coverage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Superseding a run is right on a pull request and destructive on `main`.
# `github.head_ref` is set only on a pull request, so a push to `main`, a tag
# or a manual run falls back to `github.run_id`.
# That gives each of those a group of its own that nothing supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          # Only a job that finished may write the depot cache; see test.yml.
          save-always: false
      - uses: julia-actions/julia-runtest@v1
        with:
          test_args: skip_quality
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
