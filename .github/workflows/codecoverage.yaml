name: Code coverage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Superseding a run is right on a pull request and destructive on `main`.
# `github.head_ref` is set only on a pull request, so a push to `main`, a tag
# or a manual run falls back to `github.run_id`.
# That gives each of those a group of its own that nothing supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Coverage measures the test suite, so it is gated on the same paths.
  changes:
    name: Decide whether coverage needs to run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.filter.outputs.matched }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit's first parent is the base, which the action
          # diffs against, so the full history is needed rather than a
          # single-commit checkout.
          fetch-depth: 0
      - id: filter
        uses: ./.github/actions/changed-paths
        with:
          label: 'coverage'
          patterns: >-
            ^(src/|ext/|test/|data/|docs/fits/|scripts/|Project\.toml|\.github/(workflows/(test\.yml|codecoverage\.yaml)|actions/changed-paths/))

  coverage:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          # Only a job that finished may write the depot cache; see test.yml.
          save-always: false
      - uses: julia-actions/julia-runtest@v1
        with:
          test_args: skip_quality
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
