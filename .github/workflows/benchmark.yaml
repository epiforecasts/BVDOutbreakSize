name: Benchmark

# Per-component AD gradient comparison against `main`, posted as a single
# PR comment by AirspeedVelocity.
#
# One job, one machine. `benchpkg` checks out and benchmarks both revisions
# itself, inside this job, which is the whole point of the change. Each
# revision used to get its own job, so every ratio divided one hosted
# runner's speed by another's. That pool is heterogeneous by about a factor
# of two and the difference landed whole on the ratio: on four pull requests
# that touched no differentiated source all sixteen log-density benchmarks
# moved together, by 1.37x, 0.61x, 0.78x and 0.98x, and the same component
# ranged from 971 ns to 1.90 us across nine runs of equivalent code.
#
# The suite is frozen at the default branch. `benchpkg` resolves
# `benchmark/benchmarks.jl`, and everything it includes, once from
# `--bench-on`, then runs that one suite against each revision's `src/`. So
# a change to the suite or to `test/ad_fixtures.jl` takes effect on the pull
# request after it, not its own. That is the pattern's design: it is what
# lets a revision that predates a component still be measured, and it means
# a pull request that renames a model cannot break the baseline arm.
#
# Paths-filtered, so it runs only when the differentiated surface or the
# suite itself changes. It does not run on pushes to `main`, and there is no
# benchmark-history job: the docs workflow already spends hours fitting and
# the runner queue has no room for a timeline.
#
# Uses `pull_request`, not `pull_request_target`, so a fork's code never
# runs with a write token. Fork pull requests are skipped outright, since
# they could not post the comment anyway.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'ext/**'
      - 'benchmark/**'
      - 'test/ad_fixtures.jl'
      - '.github/workflows/benchmark.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Two revisions, each compiling its own gradients before anything is
    # timed, at roughly 20 minutes a side, plus the package-load samples
    # AirspeedVelocity takes per revision.
    timeout-minutes: 120
    steps:
      # Full checkout: the action reads the repo-root `Project.toml` for the
      # package name, and runs `benchpkg` from this working tree.
      - uses: actions/checkout@v7

      # The action installs Julia, caches the depot, benchmarks both
      # revisions and posts the comparison comment itself. There is no
      # `cache-name` input to pass through it, so the depot cache it manages
      # uses the action's own key rather than a pinned snapshot.
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: '1'
          mode: 'time,memory'
