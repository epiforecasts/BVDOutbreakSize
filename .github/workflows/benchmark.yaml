name: Benchmark

# Per-component AD gradient comparison against `main`, posted as a single PR
# comment. The components are the observation submodels, the latent process,
# the single-stream composers and the full `bvd_joint`. The joint's gradient
# is ~14 ms over 76 parameters behind a ~18 min cold compile, so it is the
# dominant cost of this workflow; it is carried here rather than in the test
# suite, which asserts the components differentiate and leaves the joint to
# this comparison and to the docs build's fits (see benchmark/README.md).
#
# One job, one machine. Both revisions are materialised as git worktrees of
# this checkout and handed to `benchmark/ci/run_pair.jl`, which times them in
# one process. The hosted runner pool is heterogeneous by about a factor of
# two, so a ratio taken across two jobs measures the runners rather than the
# revisions. Worktrees because this repository declares a submodule, which
# AirspeedVelocity cannot check out itself; `benchmark/README.md` carries
# the reasoning.
#
# Each worktree runs its own `benchmark/benchmarks.jl`, its own
# `test/ad_fixtures.jl` and its own `benchmark/Project.toml`, so a pull
# request's changes to the suite are exercised by that pull request, and a
# component that exists on one side only is reported as added or removed.
#
# Paths-filtered, so it runs only when the differentiated surface or the
# suite itself changes. It does not run on pushes to `main`, and there is no
# benchmark-history job: the docs workflow already spends hours fitting, and
# a timeline of these numbers would not pay for the runner time.
#
# Uses `pull_request` (not `pull_request_target`): the comparison runs the
# PR's own code, so the comment-posting token stays scoped to same-repo PRs.
# Fork PRs are skipped outright, since they could not post the comment.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'ext/**'
      - 'benchmark/**'
      # Prose only. A README edit changes nothing that is timed.
      - '!benchmark/README.md'
      - 'test/ad_fixtures.jl'
      # An AD backend bump changes every gradient timed here, and is the
      # thing that could make the hand-written rules in `src/ad_rules.jl`
      # redundant. Dependabot raises those as a `Project.toml` edit alone.
      - 'Project.toml'
      - '.github/workflows/benchmark.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    # The joint's ~18 min cold compile sits on top of a suite that already
    # ran 42-55 min without it.
    timeout-minutes: 150
    env:
      # Benchmark the full joint, not just the components. This is the only
      # place its gradient is timed.
      BVD_BENCH_JOINT: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pr
            ref: ${{ github.event.pull_request.head.sha }}
          - name: main
            ref: ${{ github.event.pull_request.base.sha }}
    steps:
      # Full history: both revisions become worktrees of this clone, so the
      # base commit has to be in it. Submodules stay uninitialised, which is
      # what every arm here wants.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          cache-name: benchmark-env
          # Only a job that finished may write the depot cache, so a run
          # cancelled mid-`Pkg` never becomes the newest snapshot for the
          # restore key. Matches the test and docs workflows.
          save-always: false

      # On `workflow_dispatch` there is no pull request, so fall back to the
      # default branch against this checkout.
      - name: Materialise both revisions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          : "${BASE_SHA:=origin/$DEFAULT_BRANCH}"
          : "${HEAD_SHA:=HEAD}"
          git worktree add --detach "$RUNNER_TEMP/bench-main" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/bench-pr" "$HEAD_SHA"

      - name: Benchmark both revisions
        run: |
          julia --project=benchmark/ci -e 'using Pkg; Pkg.instantiate()'
          julia --project=benchmark/ci benchmark/ci/run_pair.jl \
            "$RUNNER_TEMP/bench-main" "$RUNNER_TEMP/bench-pr" results

      - name: Build comparison comment
        run: |
          julia --project=benchmark/ci benchmark/ci/comment.jl \
            results BVDOutbreakSize main pr comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            results
            comment.md

      - name: Post comparison comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- benchmark-comparison -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number });
            const existing = comments.find(
              (c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }
