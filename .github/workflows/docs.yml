name: Documenter

# The report is fanned out across CI runners instead of built in one ~5h job
# that hit GitHub's 6h cap. `list` enumerates the fits, `fit` runs them one per
# matrix job (content-addressed, so unchanged fits are cache hits), `render`
# executes the two literate pages (analysis, sensitivity) from the cached
# chains in parallel, and `combine` assembles and deploys the Vitepress site
# and publishes the results release. Everything the jobs run lives in Julia
# entry points (`docs/fits/one.jl`, `docs/execute.jl`, `docs/make.jl`), so the
# same build runs locally with `task docs`.

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve and precompile the single shared environment once, list the fit
  # ids, and pin the manifest. On a tag build the two sensitivity re-fits are
  # included; on main/PR builds they are skipped.
  list:
    name: Resolve env and list fits
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          cache-name: docs-env
      # Resolve and precompile the ONE environment every job uses (fitting and
      # rendering). Downstream jobs restore this depot cache and the pinned
      # manifest below, so precompilation is shared AND the fit and render jobs
      # use identical package versions — the fits and the render must agree on
      # the chains library (FlexiChains), or serialized chains fail to
      # deserialize. The precompile bakes the joint Mooncake rule through the
      # docs/LocalPreferences.toml workload.
      - name: Resolve and precompile the shared environment
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
            Pkg.precompile()'
      - id: ids
        env:
          BVD_RUN_SENSITIVITY: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        run: echo "ids=$(julia --project=docs docs/fits/list.jl)" >> "$GITHUB_OUTPUT"
      # Pin the resolved manifest for every downstream job so none re-resolves
      # (which would invalidate the shared compiled cache and could resolve a
      # different chains-library version than the fits were written with).
      # The docs env is part of the root [workspace] (see Project.toml), so its
      # resolved manifest is the repo-root Manifest.toml, not docs/Manifest.toml.
      # Manifest.toml is git-ignored, hence the artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: Manifest.toml
          if-no-files-found: error

  # One fit per matrix job. Each fit is content-addressed and cached, so a
  # re-run with unchanged model source and data refits nothing; the frozen
  # historical fits stay cache hits across data-only updates.
  fit:
    name: Fit ${{ matrix.id }}
    needs: list
    runs-on: ubuntu-latest
    # The current-data joint and the 1-week-back validation joint take ~3h;
    # give the heaviest fits headroom under GitHub's 360-min per-job cap. The
    # May-frozen and single-stream fits finish in under an hour.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.list.outputs.ids) }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          cache-name: docs-env
          # All matrix jobs share the one env cache (warmed by `list`), so cache
          # it once rather than per-id: per-id copies otherwise overflow the
          # 10 GB repo cache budget and evict the content-addressed fit chains.
          include-matrix: false
      # Content-addressed cache of the fit: reused whenever the fit-relevant
      # source and data are unchanged, so a re-run refits nothing.
      - name: Restore fit cache
        id: cache
        uses: actions/cache@v6
        with:
          path: logs/fit_cache
          key: >-
            fit-${{ matrix.id }}-${{ hashFiles(
              'src/models/**', 'src/renewal.jl', 'src/sampling.jl',
              'src/constants.jl', 'src/data.jl', 'docs/fits/registry.jl', 'data/**') }}
      # Restore the resolved manifest from `list` (after the depot cache step,
      # so this job's cache key still matches) so instantiate installs those
      # exact versions instead of re-resolving and recompiling.
      - name: Pin the resolved manifest
        uses: actions/download-artifact@v8
        with:
          name: manifest
          path: .
      - name: Fit ${{ matrix.id }}
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          BVD_FIT_ID: ${{ matrix.id }}
          BVD_FIT_CACHE: logs/fit_cache
          JULIA_NUM_THREADS: '4'
          BVD_FIT_LOG: none
        run: |
          julia --project=docs -e 'using Pkg; Pkg.instantiate()'
          julia --project=docs docs/fits/one.jl
      - uses: actions/upload-artifact@v7
        with:
          name: fit-${{ matrix.id }}
          path: logs/fit_cache/*.jls
          if-no-files-found: error

  # Execute each literate page from the cached fits, in parallel. Each render
  # loads the chains it needs (no refitting) and emits its markdown, figures
  # and its half of the shared output/ and summary_assets/.
  render:
    name: Render ${{ matrix.page }}
    needs: fit
    runs-on: ubuntu-latest
    # From cached fits and the pinned manifest (no re-resolve or recompile —
    # `list` did that once), the render is plots/PPCs only. Split across two
    # pages, so each does about half.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        page: [analysis, sensitivity]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          cache-name: docs-env
          # Restore the one env cache warmed by `list` (and reused by `fit`)
          # rather than keying per-page. Without this the matrix `page` value
          # enters the cache key, so each render misses the shared depot and
          # re-precompiles the whole stack (~530 deps) before rendering.
          include-matrix: false
      - name: Pin the resolved manifest
        uses: actions/download-artifact@v8
        with:
          name: manifest
          path: .
      - name: Install docs dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Collect cached fits
        uses: actions/download-artifact@v8
        with:
          pattern: fit-*
          path: logs/fit_cache
          merge-multiple: true
      # Refresh the released-estimate overlay so the sensitivity page's
      # "Estimate evolution across releases" figure picks up the newest
      # results-v* release. Best-effort: on any failure it uses the committed
      # data/released_estimates.csv.
      - name: Refresh released-estimate and forecast-scoring overlays
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (julia --project=scripts -e 'using Pkg; Pkg.instantiate()' &&
           julia --project=scripts scripts/refresh_releases.jl) ||
            echo "release refresh failed; using committed released_estimates.csv"
          # Rescore every release's saved forecasts against the now-observed
          # data and refresh the per-release R_T overlay. Best-effort: on any
          # failure the committed forecast_scores.csv / rt_by_release.csv are
          # used instead.
          (julia --project=docs -e 'using Pkg; Pkg.instantiate()' &&
           julia --project=docs scripts/score_releases.jl) ||
            echo "score refresh failed; using committed scoring overlays"
      - name: Render ${{ matrix.page }}
        env:
          BVD_DOC_PAGE: ${{ matrix.page }}
          BVD_FIT_CACHE: logs/fit_cache
          BVD_FIT_LOG: none
          BVD_RUN_SENSITIVITY: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        run: julia --project=docs docs/execute.jl
      - uses: actions/upload-artifact@v7
        with:
          name: render-${{ matrix.page }}
          # The whole docs/src delta (the page markdown, its figures and its
          # share of summary_assets/) plus its half of output/. Disjoint file
          # names between the pages, so the combine step's merge is a union.
          path: |
            docs/src
            output
          if-no-files-found: warn

  # Assemble the Vitepress site from both pre-rendered pages (a single
  # makedocs, so cross-page @ref/@cite resolve) and deploy; then publish the
  # combined outputs as a results release.
  combine:
    name: Combine and deploy
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          cache-name: docs-env
      - name: Pin the resolved manifest
        uses: actions/download-artifact@v8
        with:
          name: manifest
          path: .
      - name: Install docs dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Collect rendered pages and outputs
        uses: actions/download-artifact@v8
        with:
          pattern: render-*
          merge-multiple: true
          path: .
      - name: Assemble and deploy the Vitepress site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BVD_DOCS_STAGE: combine
        run: julia --project=docs docs/make.jl
      - name: Comment PR with docs preview
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr_number = context.issue.number;
            const repo_owner = context.repo.owner;
            const repo_name = context.repo.repo;

            let base_url;
            try {
              const pages = await github.rest.repos.getPages({
                owner: repo_owner,
                repo: repo_name
              });
              base_url = pages.data.html_url.replace(/\/$/, '');
            } catch (e) {
              base_url = `https://${repo_owner}.github.io/${repo_name}`;
            }

            const docs_url = `${base_url}/previews/PR${pr_number}/`;

            const comment_body = `
            📖 **Documentation preview** is ready!

            View the docs for this PR at: ${docs_url}

            *This preview will be updated automatically when you push new commits.*
            `;

            const comments = await github.rest.issues.listComments({
              owner: repo_owner,
              repo: repo_name,
              issue_number: pr_number
            });

            const bot_comment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('Documentation preview')
            );

            if (bot_comment) {
              await github.rest.issues.updateComment({
                owner: repo_owner,
                repo: repo_name,
                comment_id: bot_comment.id,
                body: comment_body
              });
            } else {
              await github.rest.issues.createComment({
                owner: repo_owner,
                repo: repo_name,
                issue_number: pr_number,
                body: comment_body
              });
            }
      # The render jobs write the model outputs to `output/`. We publish that
      # same run's outputs as a release rather than fitting the model again.
      - name: Check results outputs
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          set -euo pipefail
          if [ ! -d output ] || [ -z "$(ls -A output)" ]; then
            echo "::error::output/ is missing or empty after the render jobs"
            exit 1
          fi
          ls -l output
      # Lift the rendered analysis page out of the multi-file Vitepress
      # site into one self-contained HTML file (CSS and fonts inlined,
      # SPA JavaScript dropped) for sharing and download.
      - name: Build self-contained report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          julia --project=docs scripts/standalone_report.jl \
            docs/build output/analysis.html
          ls -l output/analysis.html
      # Bundle the rendered site produced by the combine build
      # (docs/build/) so each release is a self-contained snapshot.
      - name: Zip rendered site into release bundle
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          set -euo pipefail
          if [ ! -d docs/build ]; then
            echo "::error::docs/build/ missing; expected the rendered site"
            exit 1
          fi
          (cd docs/build && zip -r "$GITHUB_WORKSPACE/output/site.zip" .)
          ls -l output/site.zip
      # On a version tag (e.g. v1.2.0) the output bundle is named after
      # the tag, so a major code release has a matching, permanent
      # output release. On main it stays a rolling per-build release.
      - name: Resolve short commit SHA
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Publish results release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && format('results-{0}', github.ref_name) || format('results-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Results {0} ({1})', github.ref_name, env.SHORT_SHA) || format('Results build {0} ({1})', github.run_number, env.SHORT_SHA) }}
          body: |
            Model outputs and input data for commit ${{ github.sha }}.

            Bundles the posterior summary tables, thinned posterior
            draws, the latent symptom-onset ("symptomatic cases")
            trajectory over time (`onsets_over_time.csv`), the one- to
            four-week-ahead forecasts of the observed streams
            (`forecast.csv`, with the one-week-back validation forecast in
            `forecast_validation.csv`) for later scoring, a copy of the
            input `observations.toml`, a
            `site.zip` snapshot of the rendered report site, and
            `analysis.html` — a self-contained single-file copy of the
            report that opens offline.

            Rendered analysis:
            https://epiforecasts.io/BVDOutbreakSize/dev/analysis

            Self-contained report (always latest build):
            https://github.com/epiforecasts/BVDOutbreakSize/releases/latest/download/analysis.html
          files: output/*
          make_latest: 'true'
