name: Documenter

# The report is fanned out across CI runners instead of built in one ~5h job
# that hit GitHub's 6h cap. `list` enumerates the fits, `fit` runs them one per
# matrix job (content-addressed, so unchanged fits are cache hits), `render`
# executes the two literate pages (analysis, sensitivity) from the cached
# chains in parallel, and `combine` assembles and deploys the Vitepress site
# and publishes the results release. Everything the jobs run lives in Julia
# entry points (`docs/fits/one.jl`, `docs/execute.jl`, `docs/make.jl`), so the
# same build runs locally with `task docs`.

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

# Superseding a run is right on a pull request and destructive on `main`.
# `github.head_ref` is set only on a pull request, so a push to `main`, a tag
# or a manual run falls back to the commit SHA, and only a pull request
# cancels the run before it. A cancelled run here also loses the hours of
# fitting it had done and the results release it would have published.
#
# Keying the non-PR runs on the SHA rather than the run id queues a release
# tag behind the `main` push of the same commit instead of racing it. The two
# runs otherwise fit the same content-addressed keys side by side, neither
# sees the other's cache until its own fit job has finished, and the tag's
# joint fit, on a slower runner, was the one that hit the job's time limit
# (v2.1.0). Queued, the tag run starts after the `main` run has written every
# fit cache and restores all of them.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Compile pkgimages for a fixed set of x86-64 targets rather than for the
# machine that happens to run the job. GitHub's ubuntu-latest fleet is mixed,
# and Julia rejects a pkgimage built for a microarchitecture the host does
# not match, so a depot cache built with the default `native` target restores
# and is then thrown away. That is what makes the render jobs precompile all
# 531 packages (~16 min each) from a cache they have just restored, while
# `combine`, landing on a matching machine, reuses it in 5 seconds. Every job
# here is ubuntu-latest, so one workflow-level value covers all of them. The
# string is Julia's own CI multi-target: a generic baseline plus two clones.
env:
  JULIA_CPU_TARGET: >-
    generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1)

jobs:
  # Nothing else here runs unless a pull request touches something the
  # rendered report is built from. The fits alone cost hours, and a change
  # to the test suite, the benchmarks or another workflow produces a site
  # identical to the one on `main`. A push, a tag and a manual run are
  # never gated.
  changes:
    name: Decide whether the report needs rebuilding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.filter.outputs.matched }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit's first parent is the base, which the action
          # diffs against, so the full history is needed rather than a
          # single-commit checkout.
          fetch-depth: 0
      - id: filter
        uses: ./.github/actions/changed-paths
        with:
          label: 'the report'
          # `ext/` and `scripts/` are named file by file rather than as
          # directories. The Enzyme extension is never loaded here (Enzyme is
          # not in the docs environment), and of the scripts only these three
          # run in this workflow, so a change to the SitRep downloader, the
          # scanners or the backfill driver used to rebuild the whole report
          # for a site identical to the one on `main`.
          patterns: >-
            ^(src/|data/|docs/|README\.md|Project\.toml|ext/BVDOutbreakSizeTensorBoardLoggerExt\.jl|scripts/(refresh_releases|score_releases|standalone_report)\.jl|\.github/(workflows/docs\.yml|actions/changed-paths/))

  # Resolve and precompile the single shared environment once, list the fit
  # ids, and pin the manifest. On a tag build the two sensitivity re-fits are
  # included; on main/PR builds they are skipped.
  list:
    name: Resolve env and list fits
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
      fit_hash: ${{ steps.fit_hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          cache-name: docs-env
          # Only a job that finished may write the depot cache; see test.yml.
          save-always: false
      # Resolve and precompile the ONE environment every job uses (fitting and
      # rendering). Downstream jobs restore this depot cache and the pinned
      # manifest below, so precompilation is shared AND the fit and render jobs
      # use identical package versions — the fits and the render must agree on
      # the chains library (FlexiChains), or serialized chains fail to
      # deserialize. The precompile bakes the joint Mooncake rule through the
      # docs/LocalPreferences.toml workload.
      - name: Resolve and precompile the shared environment
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
            Pkg.precompile()'
      # Temporary, and duplicated in the other job on purpose rather than
      # pulled into a composite action: it exists to confirm the diagnosis
      # behind JULIA_CPU_TARGET above and comes out once a run shows the
      # render reusing the depot. Until then it tells a job that recompiled
      # from a restored depot apart from one that simply landed on a
      # different machine, which the timings alone cannot do.
      - name: Record the runner's CPU
        run: |
          echo "\`${{ github.job }}\` on $(julia -e 'print(Sys.CPU_NAME)')" \
            >> "$GITHUB_STEP_SUMMARY"
      - id: ids
        env:
          BVD_RUN_SENSITIVITY: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        run: echo "ids=$(julia --project=docs docs/fits/list.jl)" >> "$GITHUB_OUTPUT"
      # The fit cache key, computed by the same `fit_content_hash` the fits
      # themselves are keyed on, so the Actions cache and the Julia cache
      # cannot disagree about what invalidates a fit.
      #
      # They did. `hashFiles` was given `data/**`, which covers the generated
      # scoring tables (`forecast_scores.csv`, `rt_by_release*.csv`,
      # `released_estimates.csv` and the rest) and `data/README.md`, every one
      # of which `FIT_DATA_EXCLUDE` drops from the Julia key. A rescore commit
      # or a README edit therefore missed the Actions cache and refit
      # everything, for inputs no fit reads. It also left out
      # `docs/fits/cache.jl`, which is in `FIT_SOURCE_FILES` because it
      # defines what the key covers, so a change to the hashing rule itself
      # would not have busted the Actions key.
      #
      # Deriving the key rather than restating it is what stops the two
      # drifting again: there is now one list, in `registry.jl`.
      - id: fit_hash
        run: |
          set -euo pipefail
          HASH=$(julia --project=docs -e '
            include("docs/fits/registry.jl"); print(fit_content_hash())')
          if [ -z "$HASH" ]; then
            echo "::error::fit_content_hash produced nothing; refusing to" \
              "key the fit cache on an empty string"
            exit 1
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Fit content hash: \`$HASH\`" >> "$GITHUB_STEP_SUMMARY"
      # Pin the resolved manifest for every downstream job so none re-resolves
      # (which would invalidate the shared compiled cache and could resolve a
      # different chains-library version than the fits were written with).
      # The docs env is part of the root [workspace] (see Project.toml), so its
      # resolved manifest is the repo-root Manifest.toml, not docs/Manifest.toml.
      # Manifest.toml is git-ignored, hence the artifact.
      # Every artifact this workflow uploads is a handoff inside the run:
      # `fit` feeds `render`, `render` feeds `combine`, and nothing reads any
      # of them afterwards (no step passes a `run-id`). The durable fit cache
      # is `actions/cache` above, keyed on the model sources and data. Left at
      # the 90-day default these built up to 6800 artifacts and 36 GB, which
      # exhausted the storage quota and failed uploads with a 403 on
      # finalisation. Three days keeps a window for debugging a failed run.
      - uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: Manifest.toml
          if-no-files-found: error
          retention-days: 3

  # One fit per matrix job. Each fit is content-addressed and cached, so a
  # re-run with unchanged model source and data refits nothing; the frozen
  # historical fits stay cache hits across data-only updates.
  fit:
    name: Fit ${{ matrix.id }}
    needs: list
    runs-on: ubuntu-latest
    # The current-data joint and the 1-week-back validation joint take ~3h;
    # give the heaviest fits headroom under GitHub's 360-min per-job cap. The
    # May-frozen and single-stream fits finish in under an hour.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.list.outputs.ids) }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          cache-name: docs-env
          # Only a job that finished may write the depot cache; see test.yml.
          save-always: false
          # All matrix jobs share the one env cache (warmed by `list`), so cache
          # it once rather than per-id: per-id copies otherwise overflow the
          # 10 GB repo cache budget and evict the content-addressed fit chains.
          include-matrix: false
      # Content-addressed cache of the fit: reused whenever the fit-relevant
      # source and data are unchanged, so a re-run refits nothing. The hash is
      # the one `list` took from `fit_content_hash`, so this key and the
      # `.jls` file name inside the cache are derived from the same list of
      # inputs rather than from two lists that can drift.
      - name: Restore fit cache
        id: cache
        uses: actions/cache@v6
        with:
          path: logs/fit_cache
          key: fit-${{ matrix.id }}-${{ needs.list.outputs.fit_hash }}
      # Restore the resolved manifest from `list` (after the depot cache step,
      # so this job's cache key still matches) so instantiate installs those
      # exact versions instead of re-resolving and recompiling.
      - name: Pin the resolved manifest
        uses: actions/download-artifact@v8
        with:
          name: manifest
          path: .
      # The fleet is mixed and the joint fit's wall clock varies by half
      # again between runs of the same commit, so the summary names the CPU
      # a refit ran on. Read it next to the fit's timing when a job runs long.
      - name: Record the runner's CPU
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "\`fit ${{ matrix.id }}\` on $(julia -e 'print(Sys.CPU_NAME)')," \
            "$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Fit ${{ matrix.id }}
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          BVD_FIT_ID: ${{ matrix.id }}
          BVD_FIT_CACHE: logs/fit_cache
          JULIA_NUM_THREADS: '4'
          # `progress`, not `none`: the dependency-free stream from
          # `progress_callback`, one `iteration= lp= divergences=` line per
          # ten iterations into `logs/<name>.log`. It needs no
          # TensorBoardLogger and costs an appended line per ten steps. The
          # heartbeat below lifts it into the job log, because the joint fit
          # runs for hours and otherwise prints nothing at all between its
          # initial step size and its result.
          BVD_FIT_LOG: progress
        run: |
          set -uo pipefail
          julia --project=docs -e 'using Pkg; Pkg.instantiate()'
          mkdir -p logs
          # Report the newest progress line once a minute, and only when it
          # has moved. A fit that is running prints a rising iteration count;
          # one that has stalled prints nothing, which is the distinction the
          # job log cannot otherwise make. The callback names its file after
          # the fit, which is not always the matrix id (the frozen fits carry
          # their cut-off date), so take whichever log is newest rather than
          # guessing the name. One fit runs per job.
          (
            last=""
            start=$SECONDS
            while sleep 60; do
              # `|| true` on both: GitHub runs the step under `bash -e`, and
              # before the first progress line lands the glob matches nothing
              # and `ls` exits 2, which would kill this subshell on its first
              # tick and silently disable the heartbeat for the whole fit.
              newest=$(ls -t logs/*.log 2>/dev/null | head -n 1) || true
              [ -n "$newest" ] || continue
              line=$(tail -n 1 "$newest" 2>/dev/null) || true
              [ -n "$line" ] && [ "$line" != "$last" ] || continue
              printf '[%3dm] %s\n' "$(( (SECONDS - start) / 60 ))" "$line"
              last="$line"
            done
          ) &
          heartbeat=$!
          trap 'kill "$heartbeat" 2>/dev/null || true' EXIT
          julia --project=docs docs/fits/one.jl
      # `one.jl` writes the fit's diagnostics to the job summary itself. A
      # cache hit skips it, so say so rather than leaving the job blank.
      - name: Note the cached fit
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          echo '### Fit `${{ matrix.id }}`: cache hit, not refitted' \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: fit-${{ matrix.id }}
          path: logs/fit_cache/*.jls
          if-no-files-found: error
          retention-days: 3

  # Rescore the published releases and refresh the release overlays, once, in
  # parallel with the fits. Nothing here reads this run's fits: the scoring
  # compares past releases' saved forecasts against the current data, so it
  # can start as soon as the environment is resolved.
  overlays:
    name: Refresh release overlays
    needs: [changes, list]
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          cache-name: docs-env
          # Only a job that finished may write the depot cache; see test.yml.
          save-always: false
      - name: Pin the resolved manifest
        uses: actions/download-artifact@v8
        with:
          name: manifest
          path: .
      # Refresh the released-estimate overlay so the sensitivity page's
      # "Estimate evolution across releases" figure picks up the newest
      # results-v* release. Best-effort: on any failure it uses the committed
      # data/released_estimates.csv.
      - name: Refresh released-estimate and forecast-scoring overlays
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          julia --project=docs -e 'using Pkg; Pkg.instantiate()'
          (julia --project=scripts -e 'using Pkg; Pkg.instantiate()' &&
           julia --project=scripts scripts/refresh_releases.jl) ||
            echo "release refresh failed; using committed released_estimates.csv"
          # Rescore every release's saved forecasts against the now-observed
          # data and refresh the per-release R_T overlay.
          #
          # Not best-effort, deliberately. Falling back to the committed
          # forecast_scores.csv / forecast_overlay.csv would publish skill
          # scores and forecast-versus-observed figures against whatever
          # truth series those files were last written from, with nothing on
          # the rendered page saying so. This step writes them, so they are
          # stale by construction. A hard failure is recoverable by
          # re-running the job; a silent substitution is not detectable from
          # the page at all.
          julia --project=docs scripts/score_releases.jl
      # Every CSV under data/, not just the ten this step rewrites: a new
      # output would otherwise be left behind silently. The render restores
      # them over its own checkout, so an untouched file is replaced by an
      # identical copy. None of them enters a fit cache key (they are all in
      # `FIT_DATA_EXCLUDE`), so the render's strict cache lookups still hit.
      - uses: actions/upload-artifact@v7
        with:
          name: overlays
          path: data/*.csv
          if-no-files-found: error
          retention-days: 3

  # Gate the build on the headline joint fit having converged. It reads the
  # same cached chains the render does, so it costs a load and a few thousand
  # R-hats rather than a refit.
  #
  # A leaf job on purpose. `combine` does not need it, so a build whose joint
  # fit has not converged still renders the report, deploys the preview and
  # comments the preview link: the pages are how anyone diagnoses the failure,
  # and the fit diagnostics are on them. What this job adds is that the build
  # goes red and says so in a comment of its own, rather than the failure being
  # something a reader has to go looking for.
  convergence:
    name: Check joint convergence
    needs: fit
    # Not the default `success()`. The verdict is one comment edited in
    # place, so a build where this job never ran leaves the previous build's
    # verdict on the thread reading as current: "no new comment" and "still
    # converged" look the same. The fit matrix is `fail-fast: false`, so one
    # failed leg would otherwise skip this job silently. Running anyway
    # reaches the steps below, which find no fit and say the check could not
    # be made.
    #
    # A cancelled run has nothing to report. A `fit` that was skipped means
    # no fit was attempted, either because this change does not reach the
    # report and the whole build was gated off, or because `list` failed and
    # the build is already red for a reason that has nothing to do with
    # convergence. Neither is a verdict on the fits.
    #
    # Dependabot runs with a read-only token that cannot comment, so it is
    # skipped outright as `combine` skips it. A dependency bump does not
    # change a fit cache key, so the gate would only restate `main`'s verdict.
    #
    # The `${{ }}` is required, not decoration: an `if` whose expression
    # starts with `!` has to be wrapped or quoted.
    if: >-
      ${{ !cancelled() && needs.fit.result != 'skipped' &&
      github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          cache-name: docs-env
          # Only a job that finished may write the depot cache; see test.yml.
          save-always: false
      - name: Pin the resolved manifest
        uses: actions/download-artifact@v8
        with:
          name: manifest
          path: .
      - name: Install docs dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      # Only the gated fit, not the whole `fit-*` set: the single-stream
      # chains are not gated and downloading them all costs minutes.
      # `continue-on-error` so a missing fit reaches the check, which fails
      # on the strict cache miss naming the key it looked for, rather than
      # ending the job here with nothing said on the pull request.
      - name: Collect the joint fit
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: fit-joint
          path: logs/fit_cache
      # `continue-on-error` so the verdict is commented before the job fails
      # on it. The failure is re-raised in the last step.
      #
      # `BVD_CONVERGENCE_IDS` is set here rather than left to its default so
      # that this job's scope and the artifact fetched above are one edit
      # apart. The gate takes any list of fit ids, which is what it is for
      # locally, but a CI run can only judge fits whose chains it has: adding
      # an id here without adding its artifact above gives a strict cache
      # miss, not a verdict.
      - name: Check convergence
        id: check
        continue-on-error: true
        env:
          BVD_FIT_CACHE: logs/fit_cache
          BVD_CONVERGENCE_IDS: joint
          BVD_CONVERGENCE_REPORT: logs/convergence.md
        run: julia --project=docs docs/fits/check_convergence.jl
      # One comment per pull request, edited in place on every build, so the
      # thread carries the current verdict rather than one comment per push.
      # A comment that cannot be posted must not decide the verdict, hence
      # `continue-on-error` — the last step is what fails the build.
      - name: Comment the convergence verdict
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- bvd-fit-convergence -->';
            const path = 'logs/convergence.md';
            const status = '${{ steps.check.outputs.status }}';

            // The check itself failed to run (a missing fit, a load error).
            // Say that rather than leaving the thread silent.
            const body = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : `${marker}\n## Fit convergence: could not be checked\n\n` +
                `The convergence check did not produce a verdict. ` +
                `See the job log.\n`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );
            const existing = comments.find(c => c.body.includes(marker));

            // Nothing to say on a passing build that has never had a comment
            // here: the green check is the signal. An existing comment is
            // updated so a fix shows as resolved in place.
            if (!existing && status === 'pass') {
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body }
              );
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body }
              );
            }
      # A push to `main` or a tag has no pull request to comment on, and it is
      # the build that publishes the results release. Leave the verdict on the
      # commit so it is visible from the history rather than only inside a
      # workflow run.
      - name: Comment the convergence verdict on the commit
        if: >-
          steps.check.outcome == 'failure' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'logs/convergence.md';
            if (!fs.existsSync(path)) return;
            const { owner, repo } = context.repo;
            await github.rest.repos.createCommitComment({
              owner, repo,
              commit_sha: context.sha,
              body: fs.readFileSync(path, 'utf8')
            });
      # Two ways to get here, and they need different messages. A verdict of
      # `fail` means the fit is bad. No verdict at all means the check never
      # got that far (a missing fit, a malformed threshold), so there is
      # nothing in the job summary to point anyone at and the fits have not
      # been judged either way.
      - name: Fail the build when the gate did not pass
        if: steps.check.outcome == 'failure'
        env:
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          if [ -z "$STATUS" ]; then
            echo "::error::the convergence check did not reach a verdict," \
              "so the fits are unjudged; see this job's log"
          else
            echo "::error::a gated fit did not clear the convergence" \
              "thresholds; the verdict is in this job's summary"
          fi
          exit 1

  # Execute each literate page from the cached fits, in parallel. Each render
  # loads the chains it needs (no refitting) and emits its markdown, figures
  # and its half of the shared output/ and summary_assets/.
  render:
    name: Render ${{ matrix.id }}
    needs: [fit, overlays]
    runs-on: ubuntu-latest
    # From cached fits and the pinned manifest (no re-resolve or recompile —
    # `list` did that once), the render is plots/PPCs only. Split across three
    # pages, so each does a share.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # `id` is the page path under docs/pages; `slug` is the same with
        # the separator flattened, because an artifact name cannot carry a
        # slash.
        include:
          - id: methods
            slug: methods
          - id: estimates/national
            slug: estimates-national
          - id: estimates/province
            slug: estimates-province
          - id: forecasts/national
            slug: forecasts-national
          - id: evaluation/insample
            slug: evaluation-insample
          - id: evaluation/forecast
            slug: evaluation-forecast
          - id: sensitivity
            slug: sensitivity
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          cache-name: docs-env
          # Only a job that finished may write the depot cache; see test.yml.
          save-always: false
          # Restore the one env cache warmed by `list` (and reused by `fit`)
          # rather than keying per-page. Without this the matrix `page` value
          # enters the cache key, so each render misses the shared depot and
          # re-precompiles the whole stack (~530 deps) before rendering.
          include-matrix: false
      # Temporary, and duplicated in the other job on purpose rather than
      # pulled into a composite action: it exists to confirm the diagnosis
      # behind JULIA_CPU_TARGET above and comes out once a run shows the
      # render reusing the depot. Until then it tells a job that recompiled
      # from a restored depot apart from one that simply landed on a
      # different machine, which the timings alone cannot do.
      - name: Record the runner's CPU
        run: |
          echo "\`${{ github.job }}\` on $(julia -e 'print(Sys.CPU_NAME)')" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Pin the resolved manifest
        uses: actions/download-artifact@v8
        with:
          name: manifest
          path: .
      - name: Install docs dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Collect cached fits
        uses: actions/download-artifact@v8
        with:
          pattern: fit-*
          path: logs/fit_cache
          merge-multiple: true
      # The release overlays the `overlays` job rescored, over this job's own
      # checkout of data/.
      - name: Collect the refreshed release overlays
        uses: actions/download-artifact@v8
        with:
          name: overlays
          path: data
      - name: Render ${{ matrix.id }}
        env:
          BVD_DOC_PAGE: ${{ matrix.id }}
          BVD_FIT_CACHE: logs/fit_cache
          # The fit matrix has already produced every fit and they are collected
          # above, so the render must only ever load from cache. Fail fast and
          # loud on any miss (naming the key and dir) instead of silently
          # refitting the whole report into the render-job timeout.
          BVD_FIT_STRICT: true
          BVD_FIT_LOG: none
          BVD_RUN_SENSITIVITY: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        run: julia --project=docs docs/execute.jl
      - uses: actions/upload-artifact@v7
        with:
          name: render-${{ matrix.slug }}
          # The whole docs/src delta (the page markdown, its figures and its
          # share of summary_assets/) plus its half of output/. Disjoint file
          # names between the pages, so the combine step's merge is a union.
          path: |
            docs/src
            output
          if-no-files-found: warn
          retention-days: 3

  # Assemble the Vitepress site from both pre-rendered pages (a single
  # makedocs, so cross-page @ref/@cite resolve) and deploy; then publish the
  # combined outputs as a results release.
  combine:
    name: Combine and deploy
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Every branch's preview lands on the one gh-pages ref, so two PRs
    # deploying at once race and the loser's push is rejected as
    # non-fast-forward. The workflow-level group above is keyed on the source
    # ref and so cannot see that; key this job on the destination instead.
    # Queue rather than cancel: a superseded deploy still has a preview to
    # publish, and the job is short.
    concurrency:
      group: docs-deploy-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
      statuses: write
      pull-requests: write
    # Dependabot-triggered workflows run with a read-only GITHUB_TOKEN, so
    # the deploy-and-comment steps below would all fail. Skip the job
    # entirely; dependabot PRs only need the test results, not a docs preview.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          cache-name: docs-env
          # Only a job that finished may write the depot cache; see test.yml.
          save-always: false
      - name: Pin the resolved manifest
        uses: actions/download-artifact@v8
        with:
          name: manifest
          path: .
      - name: Install docs dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Collect rendered pages and outputs
        uses: actions/download-artifact@v8
        with:
          pattern: render-*
          merge-multiple: true
          path: .
      - name: Assemble and deploy the Vitepress site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BVD_DOCS_STAGE: combine
        run: julia --project=docs docs/make.jl
      - name: Comment PR with docs preview
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr_number = context.issue.number;
            const repo_owner = context.repo.owner;
            const repo_name = context.repo.repo;

            let base_url;
            try {
              const pages = await github.rest.repos.getPages({
                owner: repo_owner,
                repo: repo_name
              });
              base_url = pages.data.html_url.replace(/\/$/, '');
            } catch (e) {
              base_url = `https://${repo_owner}.github.io/${repo_name}`;
            }

            const docs_url = `${base_url}/previews/PR${pr_number}/`;

            const comment_body = `
            📖 **Documentation preview** is ready!

            View the docs for this PR at: ${docs_url}

            *This preview will be updated automatically when you push new commits.*
            `;

            const comments = await github.rest.issues.listComments({
              owner: repo_owner,
              repo: repo_name,
              issue_number: pr_number
            });

            const bot_comment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('Documentation preview')
            );

            if (bot_comment) {
              await github.rest.issues.updateComment({
                owner: repo_owner,
                repo: repo_name,
                comment_id: bot_comment.id,
                body: comment_body
              });
            } else {
              await github.rest.issues.createComment({
                owner: repo_owner,
                repo: repo_name,
                issue_number: pr_number,
                body: comment_body
              });
            }
      # The render jobs write the model outputs to `output/`. We publish that
      # same run's outputs as a release rather than fitting the model again.
      - name: Check results outputs
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          set -euo pipefail
          if [ ! -d output ] || [ -z "$(ls -A output)" ]; then
            echo "::error::output/ is missing or empty after the render jobs"
            exit 1
          fi
          ls -l output
      # Lift the rendered analysis page out of the multi-file Vitepress
      # site into one self-contained HTML file (CSS and fonts inlined,
      # SPA JavaScript dropped) for sharing and download.
      - name: Build self-contained report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          julia --project=docs scripts/standalone_report.jl \
            docs/build output/analysis.html
          ls -l output/analysis.html
      # Bundle the rendered site produced by the combine build
      # (docs/build/) so each release is a self-contained snapshot.
      - name: Zip rendered site into release bundle
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          set -euo pipefail
          if [ ! -d docs/build ]; then
            echo "::error::docs/build/ missing; expected the rendered site"
            exit 1
          fi
          (cd docs/build && zip -r "$GITHUB_WORKSPACE/output/site.zip" .)
          ls -l output/site.zip
      # On a version tag (e.g. v1.2.0) the output bundle is named after
      # the tag, so a major code release has a matching, permanent
      # output release. On main it stays a rolling per-build release.
      - name: Resolve short commit SHA
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Publish results release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && format('results-{0}', github.ref_name) || format('results-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Results {0} ({1})', github.ref_name, env.SHORT_SHA) || format('Results build {0} ({1})', github.run_number, env.SHORT_SHA) }}
          body: |
            Model outputs and input data for commit ${{ github.sha }}.

            Bundles the posterior summary tables, thinned posterior
            draws, the latent symptom-onset ("symptomatic cases")
            trajectory over time (`onsets_over_time.csv`), the one- to
            four-week-ahead forecasts of the observed streams
            (`forecast.csv`, with the one-week-back validation forecast in
            `forecast_validation.csv`) for later scoring, a copy of the
            input `observations.toml`, a
            `site.zip` snapshot of the rendered report site, and
            `analysis.html` — a self-contained single-file copy of the
            report that opens offline.

            Rendered analysis:
            https://epiforecasts.io/BVDOutbreakSize/dev/analysis

            Self-contained report (always latest build):
            https://github.com/epiforecasts/BVDOutbreakSize/releases/latest/download/analysis.html
          files: output/*
          make_latest: 'true'
