name: CompatHelper

# On-demand Julia dependency updater. Dependabot (see .github/dependabot.yml)
# opens the scheduled weekly `[compat]` bumps, but GitHub offers no way to run
# it off-schedule, so this workflow gives a manual "Run workflow" button via
# `workflow_dispatch`. CompatHelper is the Julia-native `[compat]` updater; the
# `subdirs` list mirrors the `julia` Dependabot entry (the root workspace, which
# covers the main package plus its `test/` and `docs/` members, and the
# non-member tooling projects).
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  compathelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Install CompatHelper
        run: julia --color=yes -e 'import Pkg; Pkg.add("CompatHelper")'
      - name: Run CompatHelper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          julia --color=yes -e '
            using CompatHelper
            CompatHelper.main(;
                subdirs = ["", "test/jet", "test/enzyme", "test/formatter",
                    "scripts"])'
