repos:
#####
# Basic file cleanliness
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-added-large-files
    -   id: check-yaml
    -   id: check-toml
    -   id: check-merge-conflict
    -   id: check-json
    -   id: debug-statements
    -   id: end-of-file-fixer
    -   id: mixed-line-ending
    -   id: trailing-whitespace
#####
# Julia
# The hook uses pre-commit's native `language: julia`, which builds the
# hook its own environment and installs Runic there from
# `additional_dependencies`. That environment never reads
# `test/formatter/`, so the version below is a second declaration of one
# version rather than a duplicate of the pin there.
# `test/package/CodeFormatting.jl` fails if the two drift.
-   repo: https://github.com/fredrikekre/runic-pre-commit
    rev: v2.2.0
    hooks:
    -   id: runic
        additional_dependencies: ['Runic@1.10.0']
#####
# CI path gating
# The patterns the workflows skip work on are wrong in silence in both
# directions: too narrow and a change skips the job that would have caught
# it, too wide and the gate saves nothing. Neither shows up as a failure, so
# the table is checked here. pre-commit runs on every pull request and is
# itself ungated, so this cannot be skipped by the thing it is checking.
# `language: python` with the parser named, not `system`. The script reads
# the patterns out of the workflow YAML, and `system` would run whichever
# `python3` is first on PATH and hope PyYAML is in it. That holds in CI only
# because pre-commit is pip-installed into the same interpreter and brings
# PyYAML with it; a contributor whose pre-commit came from pipx, brew or uv
# has it in an isolated environment and would get an import error on every
# commit touching a gated workflow. The Runic hook above avoids the same
# trap for the same reason.
-   repo: local
    hooks:
    -   id: ci-path-gating
        name: CI path gating behaves as intended
        entry: .github/actions/changed-paths/patterns_test.sh
        language: python
        additional_dependencies: ['pyyaml']
        pass_filenames: false
        files: '^\.github/(workflows/(docs|test)\.yml|workflows/codecoverage\.yaml|actions/changed-paths/)'
#####
# Secrets
-   repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    -   id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '.*/Manifest\.toml$'
