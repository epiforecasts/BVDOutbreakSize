# Environment for the CI comparison only: the driver that runs both arms and
# the script that turns their results into the PR comment. It carries no
# model dependency. `benchmark/Project.toml` is the environment the suite
# itself runs in, taken from each arm's own worktree.
[deps]
AirspeedVelocity = "1c8270ee-6884-45cc-9545-60fa71ec23e4"
JSON3 = "0f8b85d8-7281-11e9-16c2-39a750bddbf1"

[compat]
AirspeedVelocity = "0.6"
JSON3 = "1"
julia = "1.11"
